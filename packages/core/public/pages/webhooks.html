<div class="card">
  <div class="card-title"><span>第三方系统消息分发</span></div>

  <div class="split-layout">
    <!-- 左栏：注册订阅节点 -->
    <div class="split-col">
      <h3 style="font-size:0.925rem; font-weight:700; color:var(--text-main);">+ 注册新订阅节点</h3>
      <div class="builder-form">
        <div class="form-field-item"><label>系统名称 (例如 办公OA系统)</label><input type="text" id="hookName" placeholder="例如 办公OA系统"></div>
        <div class="form-field-item"><label>接口回调地址 (URL)</label><input type="text" id="hookUrl" placeholder="http://192.168.1.50/api/vfusion-callback"></div>
        <button class="btn btn-primary" style="padding:0.5rem; justify-content:center;" onclick="addWebhookNode()">+ 添加订阅节点</button>
      </div>
    </div>

    <!-- 右栏：订阅节点列表 -->
    <div class="split-col">
      <h3 style="font-size:0.925rem; font-weight:700; color:var(--text-main);">已注册第三方订阅节点</h3>
      <div class="table-container">
        <table>
          <thead><tr><th class="col-idx">序号</th><th>系统名称</th><th>回调地址</th><th>操作</th></tr></thead>
          <tbody id="webhookTableBody"></tbody>
        </table>
      </div>
      <div id="webhookTestStatusBox" style="display:none; margin-top:0.6rem; font-size:0.775rem; padding:0.45rem 0.65rem; border-radius:6px; font-family:monospace;"></div>
    </div>
  </div>
</div>

<!-- 编辑第三方订阅节点 Modal -->
<div id="editWebhookModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); z-index:1150; align-items:center; justify-content:center;" onclick="closeEditWebhookModal()">
  <div style="position:relative; width:440px; max-width:92vw; background:#ffffff; border-radius:12px; padding:1.5rem; box-shadow:0 20px 25px -5px rgba(0,0,0,0.3); border:1px solid #e2e8f0;" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid #e2e8f0;">
      <h3 style="font-size:1.05rem; font-weight:700; color:#1e293b;">编辑第三方订阅节点</h3>
      <button onclick="closeEditWebhookModal()" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:#64748b; font-weight:bold;">✕</button>
    </div>

    <form onsubmit="handleSaveWebhook(event)">
      <input type="hidden" id="editWebhookId">
      <div style="display:flex; flex-direction:column; gap:1rem;">
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">系统名称 <span style="color:red;">*</span></label>
          <input type="text" id="editWebhookName" required style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">接口回调地址 (URL) <span style="color:red;">*</span></label>
          <input type="text" id="editWebhookUrl" required style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
        </div>
      </div>

      <div style="margin-top:1.5rem; text-align:right; display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn" style="background:#f1f5f9; color:#475569;" onclick="closeEditWebhookModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.5rem 1.25rem;">保存修改</button>
      </div>
    </form>
  </div>
</div>
