<div class="card">
  <div class="card-header">
    <h2>
      <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      新建事件信息发布
    </h2>
    <p>录入信息并上传照片，系统将自动打包为标准单据（压缩包+元数据+摘要校验+数字签名）投递至网闸摆渡目录</p>
  </div>

  <form id="publishForm" style="display:flex; flex-direction:column; flex:1;">
    <div class="split-layout">
      <!-- 左栏：表单控件 -->
      <div class="split-col">
        <div class="form-grid" id="dynamicFormGrid"></div>
      </div>

      <!-- 右栏：拖拽上传 + 预览 + 提交 -->
      <div class="split-col">
        <div class="form-group" style="flex:1;">
          <label>上传现场抓拍照片 <span class="req">*</span></label>
          <div class="upload-zone" onclick="document.getElementById('photoInput').click()">
            <svg class="upload-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <p style="font-size:0.875rem; font-weight:600; color:var(--text-main);">点击或拖拽上传照片</p>
            <p style="font-size:0.775rem; color:var(--text-muted); margin-top:3px;">支持 JPG / PNG，自动签署 MD5 与数字签名</p>
            <input type="file" id="photoInput" name="images" multiple accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
          </div>
          <div class="preview-container" id="previewContainer"></div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <svg class="icon-svg" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          确认提交并生成数据摆渡包
        </button>
      </div>
    </div>
  </form>

  <div class="log-card" id="logCard">
    <div class="log-title">
      <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      <span>打包成功，已完成原子重命名并存入发送目录</span>
    </div>
    <div class="log-code" id="logCode"></div>
  </div>
</div>
