<div class="card">
  <div class="card-title">
    <span>涉事人员档案库 (单向摆渡跨网自动归档)</span>
    <button class="btn btn-diode" onclick="loadPersonnelArchive()">刷新人员档案</button>
  </div>

  <div class="table-container">
    <table>
      <thead><tr><th class="col-idx">序号</th><th>姓名</th><th>身份证号码</th><th>户籍地址</th><th>最新出现时间</th><th>关联事件单据</th></tr></thead>
      <tbody id="personnelTableBody"></tbody>
    </table>
  </div>
  <div class="pagination-bar" id="personnelPagination">
    <div class="pagination-info">
      <span>共 <strong id="personnelTotalCount">0</strong> 人档案</span>
      <span>第 <strong id="personnelCurrentPageText">1</strong> / <strong id="personnelTotalPagesText">1</strong> 页</span>
    </div>
    <div class="pagination-controls">
      <select id="personnelPageSizeSelect" onchange="changePersonnelPageSize(this.value)">
        <option value="10">10 条/页</option>
        <option value="20">20 条/页</option>
        <option value="50">50 条/页</option>
      </select>
      <button class="btn-page" id="personnelPrevBtn" onclick="prevPersonnelPage()">上一页</button>
      <button class="btn-page" id="personnelNextBtn" onclick="nextPersonnelPage()">下一页</button>
    </div>
  </div>
</div>
