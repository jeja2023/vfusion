<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-info">
      <h3>已汇聚事件总数</h3>
      <div class="num" id="statEvents">0</div>
    </div>
    <div class="stat-icon-wrapper">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>已接入应用系统</h3>
      <div class="num" id="statApps">2</div>
    </div>
    <div class="stat-icon-wrapper">
      <svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>数字签名校验成功率</h3>
      <div class="num" style="color:var(--success);">100%</div>
    </div>
    <div class="stat-icon-wrapper">
      <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--success);"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>网闸单向通道状态</h3>
      <div class="num" style="font-size:1.1rem; color:var(--success); margin-top:0.25rem;" id="diodeStatusText">手动摆渡模式</div>
    </div>
    <div class="stat-icon-wrapper">
      <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--success);"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
  </div>
</div>

<div class="main-grid">
  <div class="card">
    <div class="card-title">
      <span>汇聚事件与数据看板</span>
      <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal;">点击卡片可侧滑查看完整元数据与签名哈希 (支持 Esc 关闭)</span>
    </div>

    <div class="filter-bar">
      <input type="text" id="filterKeyword" placeholder="搜索任务名称/事件编号/地点/涉事人员/操作员..." oninput="renderEvents()">
      <select id="filterTask" onchange="renderEvents()">
        <option value="">所有任务名称 (全量)</option>
      </select>
      <select id="filterType" onchange="renderEvents()">
        <option value="">所有交通方式</option>
        <option value="步行">步行</option>
        <option value="自行车/电动车">自行车/电动车</option>
        <option value="小型客车">小型客车</option>
        <option value="大型客车">大型客车</option>
        <option value="货车">货车</option>
        <option value="轨道交通">轨道交通</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th class="col-idx">序号</th>
            <th>事件单据编号</th>
            <th>所属任务名称</th>
            <th>关联任务编号</th>
            <th>提交时间</th>
            <th>录入人员</th>
            <th style="min-width:140px;">发生地点</th>
            <th>交通方式</th>
            <th>涉事人员</th>
            <th>现场照片凭证</th>
            <th style="text-align:left;">操作</th>
          </tr>
        </thead>
        <tbody id="eventTableBody">
          <tr><td colspan="11" style="text-align:center; padding:3rem; color:var(--text-muted);">暂无摆渡汇聚事件单据</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination-bar" id="evtPagination">
      <div class="pagination-info">
        <span>共 <strong id="evtTotalCount">0</strong> 条单据记录</span>
        <span>第 <strong id="evtCurrentPageText">1</strong> / <strong id="evtTotalPagesText">1</strong> 页</span>
      </div>
      <div class="pagination-controls">
        <select id="evtPageSizeSelect" onchange="changeEvtPageSize(this.value)">
          <option value="10">10 条/页</option>
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
        </select>
        <button class="btn-page" id="evtPrevBtn" onclick="prevEvtPage()">上一页</button>
        <button class="btn-page" id="evtNextBtn" onclick="nextEvtPage()">下一页</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>摆渡与校验实时日志</span>
    </div>
    <div class="log-stream" id="logStream"></div>
  </div>
</div>
