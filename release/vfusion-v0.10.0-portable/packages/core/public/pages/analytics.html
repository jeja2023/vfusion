<div class="card">
  <div class="card-title">
    <span>威胁等级与事件分布统计大屏</span>
    <div style="display:flex; gap:0.6rem;">
      <button class="btn btn-diode" onclick="toggleFullscreenDashboard()">切换安防指挥大屏模式</button>
      <button class="btn btn-diode" onclick="loadAnalytics()">刷新统计图表</button>
    </div>
  </div>
  
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; padding:1rem 0;">
    <div style="text-align:center;">
      <h4 style="font-size:0.875rem; margin-bottom:0.75rem; color:var(--text-sub);">交通方式分布统计占比</h4>
      <svg width="200" height="200" viewBox="0 0 42 42">
        <circle cx="21" cy="21" r="15.91549430918954" fill="#fff"></circle>
        <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#e2e8f0" stroke-width="5"></circle>
        <circle id="donutHigh" cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#2563eb" stroke-width="5" stroke-dasharray="40 60" stroke-dashoffset="25"></circle>
        <circle id="donutMed" cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#0284c7" stroke-width="5" stroke-dasharray="30 70" stroke-dashoffset="85"></circle>
        <circle id="donutLow" cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#16a34a" stroke-width="5" stroke-dasharray="30 70" stroke-dashoffset="55"></circle>
      </svg>
      <div style="margin-top:0.75rem; font-size:0.825rem; display:flex; justify-content:center; gap:1rem;">
        <span style="color:#2563eb;">■ 陆路交通</span>
        <span style="color:#0284c7;">■ 步行/骑行</span>
        <span style="color:#16a34a;">■ 其他/航空</span>
      </div>
    </div>

    <div>
      <h4 style="font-size:0.875rem; margin-bottom:0.75rem; color:var(--text-sub); text-align:center;">24 小时实时汇聚趋势 (单据/小时)</h4>
      <svg width="100%" height="190" viewBox="0 0 500 180" style="background:#f8fafc; border-radius:10px; border:1px solid var(--border-color);">
        <polyline fill="none" stroke="#2563eb" stroke-width="3" points="20,150 60,130 100,140 140,90 180,100 220,50 260,70 300,40 340,60 380,30 420,50 460,20"/>
        <circle cx="460" cy="20" r="4" fill="#2563eb"/>
      </svg>
    </div>
  </div>
</div>
