<div class="card">
  <div class="card-title">
    <span>存储空间与系统健康诊断大屏</span>
    <div style="display:flex; gap:0.6rem;">
      <button class="btn btn-diode" onclick="runOnlineDiagnostics()">运行在线诊断与自愈</button>
      <button class="btn btn-danger" onclick="cleanupArchives()">清理历史归档</button>
    </div>
  </div>

  <div class="split-layout">
    <!-- 左栏：容量指标与秘钥轮换 -->
    <div class="split-col">
      <h3 style="font-size:0.925rem; font-weight:700; color:var(--text-main); margin-bottom:0.25rem;">存储容量指标与秘钥安全</h3>
      <div class="stats-grid" style="margin-bottom:0.75rem;">
        <div class="stat-card">
          <div class="stat-info">
            <h3>归档 Zip 包总体积</h3>
            <div class="num" id="archiveSizeStr">0 MB</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-info">
            <h3>现场照片总体积</h3>
            <div class="num" id="assetsSizeStr">0 MB</div>
          </div>
        </div>
      </div>

      <div style="background:#f8fafc; padding:1rem; border-radius:10px; border:1px solid var(--border-color); margin-bottom:0.75rem;">
        <h4 style="font-size:0.875rem; font-weight:700; color:var(--text-main); margin-bottom:0.5rem; display:flex; align-items:center; gap:0.4rem;">
          <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          HMAC 签名秘钥在线轮换
        </h4>
        <div style="display:flex; gap:0.5rem; flex-direction:column;">
          <span style="font-size:0.8rem; color:var(--text-sub);">当前生效秘钥: <strong id="currentKeyMasked" style="font-family:monospace; color:var(--primary);">vfus****2026</strong></span>
          <input type="text" id="newHmacSecretInput" placeholder="输入新签名秘钥 (例如 vfusion_secret_key_2026)" style="padding:0.45rem 0.65rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.825rem;">
          <button class="btn btn-primary" style="padding:0.45rem; justify-content:center; margin-top:0.2rem;" onclick="rotateHmacSecret()">立即在线轮换秘钥</button>
        </div>
      </div>

      <!-- Web 一键在线无损热升级 -->
      <div style="background:#f0f9ff; padding:0.9rem; border-radius:10px; border:1px solid #bae6fd; margin-bottom:0.75rem;">
        <h4 style="font-size:0.875rem; font-weight:700; color:#0369a1; margin-bottom:0.35rem; display:flex; align-items:center; gap:0.4rem;">
          <svg class="icon-svg" viewBox="0 0 24 24" style="color:#0284c7; width:16px; height:16px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Web 控制台一键无损热升级 (系统热补丁)
        </h4>
        <div style="font-size:0.775rem; color:#0369a1; margin-bottom:0.5rem; line-height:1.4;">
          上传代码补丁包 (<code>vfusion-patch-v*.zip</code>)，系统自动备份数据库并在 3 秒内平滑重载生效，运维无需登录服务器命令窗口。
        </div>
        <div style="display:flex; gap:0.4rem; align-items:center;">
          <input type="file" id="webUpgradeFileInput" accept=".zip" style="font-size:0.75rem; flex:1; min-width:0; background:#ffffff; padding:0.25rem 0.4rem; border:1px solid #7dd3fc; border-radius:6px;">
          <button class="btn btn-primary" style="padding:0.35rem 0.75rem; white-space:nowrap; font-size:0.775rem;" onclick="uploadWebPatchUpgrade()">上传并无损更新</button>
        </div>
        <div id="webUpgradeStatusBox" style="display:none; margin-top:0.45rem; font-size:0.75rem; padding:0.45rem 0.6rem; border-radius:6px; font-family:monospace;"></div>
      </div>
    </div>

    <!-- 右栏：诊断与系统健康状态 -->
    <div class="split-col">
      <h3 style="font-size:0.925rem; font-weight:700; color:var(--text-main); margin-bottom:0.25rem;">节点运行时环境与在线拓扑</h3>
      
      <div id="systemHealthDetails" style="background:#f8fafc; padding:1rem; border-radius:10px; border:1px solid var(--border-color); font-family:monospace; font-size:0.8rem; line-height:1.6; margin-bottom:0.75rem;">
        加载系统运行时健康数据...
      </div>

      <div id="diagnoseResultsBox" style="display:none; background:#f0fdf4; border:1px solid var(--success-border); padding:1rem; border-radius:10px;">
        <h4 style="font-size:0.875rem; font-weight:700; color:var(--success); margin-bottom:0.5rem;">在线诊断与自愈结果列表</h4>
        <div id="diagnoseItemsContainer"></div>
      </div>
    </div>
  </div>
</div>
