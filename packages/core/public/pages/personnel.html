<div class="card" style="padding: 0.75rem 1rem; margin-bottom: 0.5rem;">
  <div class="card-header" style="margin-bottom: 0.4rem; padding-bottom: 0.35rem; display:flex; align-items:center; justify-content:space-between;">
    <div>
      <h2 style="font-size:0.9rem; display:flex; align-items:center; gap:0.4rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 1 0 7.75"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        涉事人员档案库 (跨网摆渡自动归档)
      </h2>
      <p style="font-size:0.725rem; margin-top:1px;">汇聚跨网摆渡单据自动抽取的涉事人员档案，支持手动登记补录与档案管理</p>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button class="btn btn-primary" style="padding:0.3rem 0.65rem; font-size:0.75rem; display:flex; align-items:center; gap:0.3rem;" onclick="openAddPersonnelModal()">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
        + 登记涉事人员档案
      </button>
      <button class="btn btn-secondary" style="padding:0.3rem 0.65rem; font-size:0.75rem; display:flex; align-items:center; gap:0.3rem;" onclick="loadPersonnelArchive()">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        刷新档案
      </button>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:0.4rem;">
    <div class="table-container">
      <table class="compact-table" style="width:100%;">
        <thead>
          <tr>
            <th class="col-idx" style="width:50px;">序号</th>
            <th style="width:150px;">姓名</th>
            <th style="width:180px;">身份证号码</th>
            <th>户籍地址 / 常住地址</th>
            <th style="width:160px;">最新出现时间</th>
            <th style="width:150px;">关联单据/事件</th>
            <th style="width:160px; text-align:center;">操作</th>
          </tr>
        </thead>
        <tbody id="personnelTableBody">
          <tr><td colspan="7" style="text-align:center; color:var(--text-muted);">加载中...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination-bar" id="personnelPagination">
      <div class="pagination-info">
        <span>共 <strong id="personnelTotalCount">0</strong> 人档案</span>
        <span>第 <strong id="personnelCurrentPageText">1</strong> / <strong id="personnelTotalPagesText">1</strong> 页</span>
      </div>
      <div class="pagination-controls">
        <select id="personnelPageSizeSelect" onchange="changePersonnelPageSize(this.value)">
          <option value="10">10 条/页</option>
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
        </select>
        <button class="btn-page" id="personnelPrevBtn" onclick="prevPersonnelPage()">上一页</button>
        <button class="btn-page" id="personnelNextBtn" onclick="nextPersonnelPage()">下一页</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal 1: + 登记涉事人员档案 弹窗 -->
<div id="addPersonnelModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); z-index:1150; justify-content:center; align-items:center;">
  <div class="card" style="width:480px; max-width:92vw; background:#fff; border-radius:10px; padding:1.25rem; box-shadow:0 12px 30px rgba(0,0,0,0.2);">
    <div style="font-size:0.925rem; font-weight:700; color:var(--primary); margin-bottom:0.8rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:0.4rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
        登记涉事人员档案
      </div>
      <button type="button" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);" onclick="closeAddPersonnelModal()">&times;</button>
    </div>

    <form onsubmit="handleAddPersonnelSubmit(event)" autocomplete="off">
      <div class="form-group" style="margin-bottom:0.6rem;">
        <label style="font-size:0.775rem; font-weight:600;">姓名 <span style="color:red;">*</span></label>
        <input type="text" id="newPersonnelName" placeholder="例如: 张三" required style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px;" autocomplete="off">
      </div>

      <div class="form-group" style="margin-bottom:0.6rem;">
        <label style="font-size:0.775rem; font-weight:600;">身份证号码</label>
        <input type="text" id="newPersonnelIdCard" placeholder="18位身份证号" style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px; font-family:monospace;" autocomplete="off">
      </div>

      <div class="form-group" style="margin-bottom:0.8rem;">
        <label style="font-size:0.775rem; font-weight:600;">户籍所在地 / 常住地址</label>
        <input type="text" id="newPersonnelDomicile" placeholder="详细户籍地址" style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px;" autocomplete="off">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn btn-secondary" style="padding:0.3rem 0.75rem; font-size:0.75rem;" onclick="closeAddPersonnelModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.3rem 0.85rem; font-size:0.75rem;">确认保存档案</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal 2: 编辑涉事人员档案 Modal -->
<div id="editPersonnelModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); z-index:1150; justify-content:center; align-items:center;">
  <div class="card" style="width:480px; max-width:92vw; background:#fff; border-radius:10px; padding:1.25rem; box-shadow:0 12px 30px rgba(0,0,0,0.2);">
    <div style="font-size:0.925rem; font-weight:700; color:var(--text-main); margin-bottom:0.8rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem; display:flex; align-items:center; justify-content:space-between;">
      <div>编辑涉事人员档案</div>
      <button type="button" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);" onclick="closeEditPersonnelModal()">&times;</button>
    </div>

    <form onsubmit="handleSavePersonnel(event)" autocomplete="off">
      <input type="hidden" id="editPersonnelId">
      <div class="form-group" style="margin-bottom:0.6rem;">
        <label style="font-size:0.775rem; font-weight:600;">姓名 <span style="color:red;">*</span></label>
        <input type="text" id="editPersonnelName" required style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px;" autocomplete="off">
      </div>

      <div class="form-group" style="margin-bottom:0.6rem;">
        <label style="font-size:0.775rem; font-weight:600;">身份证号码</label>
        <input type="text" id="editPersonnelIdCard" placeholder="18位身份证号" style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px; font-family:monospace;" autocomplete="off">
      </div>

      <div class="form-group" style="margin-bottom:0.8rem;">
        <label style="font-size:0.775rem; font-weight:600;">户籍所在地 / 常住地址</label>
        <input type="text" id="editPersonnelDomicile" placeholder="详细户籍地址" style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px;" autocomplete="off">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn btn-secondary" style="padding:0.3rem 0.75rem; font-size:0.75rem;" onclick="closeEditPersonnelModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.3rem 0.85rem; font-size:0.75rem;">保存档案修改</button>
      </div>
    </form>
  </div>
</div>
