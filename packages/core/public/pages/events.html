<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-info">
      <h3>已汇聚任务总数</h3>
      <div class="num" id="statTasksTotal" style="color:var(--primary);">0</div>
    </div>
    <div class="stat-icon-wrapper">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>任务关联图片总数</h3>
      <div class="num" id="statTaskPhotosTotal" style="color:#16a34a;">0</div>
    </div>
    <div class="stat-icon-wrapper" style="color:#16a34a;">
      <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>已接入应用系统</h3>
      <div class="num" id="statApps">2</div>
    </div>
    <div class="stat-icon-wrapper">
      <svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>网闸单向通道状态</h3>
      <div class="num" style="font-size:1.1rem; color:var(--success); margin-top:0.25rem;" id="diodeStatusText">单向通道正常 (ACTIVE)</div>
    </div>
    <div class="stat-icon-wrapper">
      <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--success);"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
  </div>
</div>

<div class="main-grid">
  <div class="card">
    <div class="card-title" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <span>跨网任务数据汇聚看板</span>
        <div style="display:inline-flex; background:#f1f5f9; padding:2px; border-radius:6px; border:1px solid #cbd5e1;">
          <button id="viewBtn-event" class="btn" style="padding:0.25rem 0.65rem; font-size:0.775rem; font-weight:700; background:#ffffff; color:var(--primary); border:none; box-shadow:0 1px 2px rgba(0,0,0,0.1); border-radius:4px;" onclick="switchCoreView('event')">事件列表</button>
          <button id="viewBtn-task" class="btn" style="padding:0.25rem 0.65rem; font-size:0.775rem; font-weight:500; background:transparent; color:#64748b; border:none; border-radius:4px;" onclick="switchCoreView('task')">任务列表</button>
        </div>
      </div>
      <span style="font-size:0.775rem; color:var(--text-muted); font-weight:normal;">点击任务或事件可侧滑查看关联现场照片与提交审计</span>
    </div>

    <div class="filter-bar">
      <input type="text" id="filterKeyword" placeholder="搜索任务名称/编号/事件ID/地点/涉事人员..." oninput="renderCoreDashboard()">
      <select id="filterTask" onchange="renderCoreDashboard()">
        <option value="">所有任务名称 (全量)</option>
      </select>
      <select id="filterType" onchange="renderCoreDashboard()">
        <option value="">所有交通方式</option>
        <option value="步行">步行</option>
        <option value="自行车/电动车">自行车/电动车</option>
        <option value="小型客车">小型客车</option>
        <option value="大型客车">大型客车</option>
        <option value="货车">货车</option>
        <option value="轨道交通">轨道交通</option>
      </select>
    </div>

    <!-- 视图 1：按任务归集数据表格 (Task Matrix Table View) -->
    <div id="taskMatrixView" style="display:none; margin-top:0.75rem;">
      <div class="table-container" style="overflow:hidden; max-height:none; border:1px solid var(--border-color); border-radius:10px;">
        <table style="width:100%; table-layout:auto;">
          <thead>
            <tr>
              <th class="col-idx" style="width:45px;">序号</th>
              <th style="min-width:180px;">任务名称</th>
              <th style="width:170px;">关联任务编号</th>
              <th style="width:90px;">任务状态</th>
              <th style="width:95px;">图片</th>
              <th style="width:95px;">摆渡次数</th>
              <th style="width:110px;">录入人员</th>
              <th style="width:145px;">最新更新时间</th>
              <th style="width:125px; text-align:left;">操作</th>
            </tr>
          </thead>
          <tbody id="taskTableBody">
            <tr><td colspan="9" style="text-align:center; padding:3rem; color:var(--text-muted);">正在汇聚任务数据...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 视图 2：事件列表 (Event Table View) -->
    <div id="eventTableView" style="display:block; margin-top:0.75rem;">
      <div class="table-container" style="overflow:hidden; max-height:none; border:1px solid var(--border-color); border-radius:10px;">
        <table style="width:100%; table-layout:fixed;">
          <thead>
            <tr>
              <th class="col-idx" style="width:40px;">序号</th>
              <th style="width:160px;">事件编号</th>
              <th style="width:170px;">所属任务名称</th>
              <th style="width:140px;">提交时间</th>
              <th style="width:90px;">录入人员</th>
              <th style="width:140px;">发生地点</th>
              <th style="width:90px;">交通方式</th>
              <th style="width:80px;">涉事人员</th>
              <th style="width:70px;">图片</th>
              <th style="width:60px; text-align:left;">操作</th>
            </tr>
          </thead>
          <tbody id="eventTableBody">
            <tr><td colspan="10" style="text-align:center; padding:3rem; color:var(--text-muted);">暂无已接收事件记录</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination-bar" id="evtPagination">
        <div class="pagination-info">
          <span>共 <strong id="evtTotalCount">0</strong> 条记录</span>
          <span>第 <strong id="evtCurrentPageText">1</strong> / <strong id="evtTotalPagesText">1</strong> 页</span>
        </div>
        <div class="pagination-controls">
          <select id="evtPageSizeSelect" onchange="changeEvtPageSize(this.value)">
            <option value="10">10 条/页</option>
            <option value="20">20 条/页</option>
            <option value="50">50 条/页</option>
          </select>
          <button class="btn-page" id="evtPrevBtn" onclick="prevEvtPage()">上一页</button>
          <button class="btn-page" id="evtNextBtn" onclick="nextEvtPage()">下一页</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>摆渡与校验实时日志</span>
    </div>
    <div class="log-stream" id="logStream"></div>
  </div>
</div>
