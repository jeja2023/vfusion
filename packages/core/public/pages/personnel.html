<div class="card">
  <div class="card-title">
    <span>涉事人员档案库 (单向摆渡跨网自动归档)</span>
    <button class="btn btn-diode" onclick="loadPersonnelArchive()">刷新人员档案</button>
  </div>

  <div class="table-container">
    <table>
      <thead><tr><th class="col-idx">序号</th><th>姓名</th><th>身份证号码</th><th>户籍地址</th><th>最新出现时间</th><th>关联事件</th><th>操作</th></tr></thead>
      <tbody id="personnelTableBody"></tbody>
    </table>
  </div>
  <div class="pagination-bar" id="personnelPagination">
    <div class="pagination-info">
      <span>共 <strong id="personnelTotalCount">0</strong> 人档案</span>
      <span>第 <strong id="personnelCurrentPageText">1</strong> / <strong id="personnelTotalPagesText">1</strong> 页</span>
    </div>
    <div class="pagination-controls">
      <select id="personnelPageSizeSelect" onchange="changePersonnelPageSize(this.value)">
        <option value="10">10 条/页</option>
        <option value="20">20 条/页</option>
        <option value="50">50 条/页</option>
      </select>
      <button class="btn-page" id="personnelPrevBtn" onclick="prevPersonnelPage()">上一页</button>
      <button class="btn-page" id="personnelNextBtn" onclick="nextPersonnelPage()">下一页</button>
    </div>
  </div>
</div>

<!-- 编辑涉事人员档案 Modal -->
<div id="editPersonnelModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); z-index:1150; align-items:center; justify-content:center;" onclick="closeEditPersonnelModal()">
  <div style="position:relative; width:440px; max-width:92vw; background:#ffffff; border-radius:12px; padding:1.5rem; box-shadow:0 20px 25px -5px rgba(0,0,0,0.3); border:1px solid #e2e8f0;" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid #e2e8f0;">
      <h3 style="font-size:1.05rem; font-weight:700; color:#1e293b;">编辑涉事人员档案</h3>
      <button onclick="closeEditPersonnelModal()" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:#64748b; font-weight:bold;">✕</button>
    </div>

    <form onsubmit="handleSavePersonnel(event)">
      <input type="hidden" id="editPersonnelId">
      <div style="display:flex; flex-direction:column; gap:1rem;">
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">姓名 <span style="color:red;">*</span></label>
          <input type="text" id="editPersonnelName" required style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">身份证号码</label>
          <input type="text" id="editPersonnelIdCard" placeholder="18位身份证号" style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem; font-family:monospace;">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">户籍所在地/常住地址</label>
          <input type="text" id="editPersonnelDomicile" placeholder="详细户籍地址" style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
        </div>
      </div>

      <div style="margin-top:1.5rem; text-align:right; display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn" style="background:#f1f5f9; color:#475569;" onclick="closeEditPersonnelModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.5rem 1.25rem;">保存档案</button>
      </div>
    </form>
  </div>
</div>
