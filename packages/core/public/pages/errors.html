<div class="card">
  <div class="card-title">
    <span>死信隔离区控制台</span>
    <button class="btn btn-diode" onclick="loadErrors()">刷新隔离区文件</button>
  </div>

  <!-- 隔离区统计指标卡片 -->
  <div class="stats-grid" style="margin-bottom:0.75rem; grid-template-columns: repeat(3, 1fr);">
    <div class="stat-card">
      <div class="stat-info">
        <h3>隔离区文件数</h3>
        <div class="num" id="statErrorCount" style="color:var(--danger);">0 个</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-info">
        <h3>死信自愈机制</h3>
        <div class="num" style="font-size:1.1rem; color:var(--success);">自动重试引擎在线</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-info">
        <h3>防篡改防破损 protection</h3>
        <div class="num" style="font-size:1.1rem; color:var(--primary);">HMAC + SHA-256 强校验</div>
      </div>
    </div>
  </div>

  <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:0.65rem 1rem; font-size:0.8rem; color:#1e40af; margin-bottom:0.75rem; display:flex; align-items:center; gap:0.5rem;">
    <svg class="icon-svg" viewBox="0 0 24 24" style="color:#2563eb;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span><strong>死信保护机制说明：</strong>当隔离网摆渡的数据 Zip 包遇到文件破损、HMAC 签名不匹配或 SHA-256 摘要校验失败时，系统将自动隔离至该目录保护主业务通道。修正后可点击【重试解包】。</span>
  </div>
  <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:1rem;">展示校验失败、签名不匹配或损坏的隔离摆渡包</p>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-idx">序号</th>
          <th>文件包名</th>
          <th>隔离时间</th>
          <th>隔离原因</th>
          <th>包文件大小</th>
          <th style="text-align:left;">操作</th>
        </tr>
      </thead>
      <tbody id="errorTableBody">
        <tr><td colspan="6" style="text-align:center; padding:3rem; color:var(--text-muted);">隔离区暂无异常损坏数据包</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-bar" id="errorPagination">
    <div class="pagination-info">
      <span>共 <strong id="errorTotalCount">0</strong> 个隔离包</span>
      <span>第 <strong id="errorCurrentPageText">1</strong> / <strong id="errorTotalPagesText">1</strong> 页</span>
    </div>
    <div class="pagination-controls">
      <select id="errorPageSizeSelect" onchange="changeErrorPageSize(this.value)">
        <option value="10">10 条/页</option>
        <option value="20">20 条/页</option>
      </select>
      <button class="btn-page" id="errorPrevBtn" onclick="prevErrorPage()">上一页</button>
      <button class="btn-page" id="errorNextBtn" onclick="nextErrorPage()">下一页</button>
    </div>
  </div>
</div>
