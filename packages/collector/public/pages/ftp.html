<div class="card">
  <div class="card-header">
    <div>
      <h2>
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        第三方 FTP 服务器通道配置
      </h2>
      <p>配置视频网端自动推送 Zip 单据数据包至指定的第三方 FTP 服务器 (支持 IP、端口、账号鉴权与远程目录)</p>
    </div>
    <div style="display:flex; gap:0.5rem; align-items:center;">
      <button class="btn btn-diode" onclick="testCollectorFtpConnection()">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        在线测试 FTP 连通性
      </button>
      <button class="btn btn-primary" onclick="saveCollectorFtpConfig()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存 FTP 通道配置
      </button>
    </div>
  </div>

  <div style="background:var(--bg-main); border:1px solid var(--border-color); border-radius:10px; padding:1.25rem; margin-top:0.25rem;">
    <div class="form-grid">
      <div class="form-group">
        <label>FTP 自动推送功能开关</label>
        <select id="collFtpEnableSelect">
          <option value="false">关闭远程 FTP 推送 (仅输出至本地网闸目录)</option>
          <option value="true">开启远程 FTP 推送 (打包后自动推送到 FTP)</option>
        </select>
      </div>

      <div class="form-group">
        <label>FTP 服务器 IP 地址 / 域名 (Host)</label>
        <input type="text" id="collFtpHostInput" placeholder="例如: 192.168.1.100">
      </div>

      <div class="form-group">
        <label>FTP 服务端口号 (Port)</label>
        <input type="number" id="collFtpPortInput" placeholder="默认: 21" value="21">
      </div>

      <div class="form-group">
        <label>FTP 登录用户名 (Username)</label>
        <input type="text" id="collFtpUserInput" placeholder="例如: vfusion_user">
      </div>

      <div class="form-group">
        <label>FTP 登录密码 (Password)</label>
        <input type="password" id="collFtpPasswordInput" placeholder="输入 FTP 密码">
      </div>

      <div class="form-group">
        <label>FTP 远程专用上传目录 (Remote Dir)</label>
        <input type="text" id="collFtpRemoteDirInput" placeholder="例如: /vfusion_packages" value="/vfusion_packages">
      </div>

      <div class="form-group">
        <label>单据包识别匹配前缀 (Prefix Filter)</label>
        <input type="text" id="collPkgPrefixInput" placeholder="默认: vfusion_" value="vfusion_">
      </div>

      <div class="form-group">
        <label>FTP 传输文件后缀 (Ext Filter / Policy)</label>
        <select id="collFtpExtSelect">
          <option value=".jpg">.jpg (强安全网闸伪装模式 - 仅放行 .jpg 文件)</option>
          <option value=".zip">.zip (标准 Zip 压缩包模式)</option>
        </select>
      </div>
    </div>
  </div>

  <div id="collFtpTestStatusBox" style="margin-top:1rem; display:none; padding:0.85rem 1rem; border-radius:8px; font-size:0.85rem; font-family:monospace; line-height:1.5;"></div>
</div>
