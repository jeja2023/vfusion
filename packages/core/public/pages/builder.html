<div class="card" style="padding: 0.75rem 1rem; margin-bottom: 0.5rem;">
  <div class="card-header" style="margin-bottom: 0.4rem; padding-bottom: 0.35rem; display:flex; align-items:center; justify-content:space-between;">
    <div>
      <h2 style="font-size:0.9rem; display:flex; align-items:center; gap:0.4rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        内网中台表单设计器
      </h2>
      <p style="font-size:0.725rem; margin-top:1px;">独立新增或修改表单字段 Schema 规范，配置保存后自动同步生效</p>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button class="btn btn-primary" style="padding:0.35rem 0.75rem; font-size:0.75rem; font-weight:600; display:flex; align-items:center; gap:0.3rem;" data-action="openAddFieldModal()">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        + 新增表单字段
      </button>
      <button type="button" style="padding:0.35rem 0.75rem; font-size:0.75rem; font-weight:600; background:#f1f5f9; border:1px solid #cbd5e1; color:#334155; border-radius:6px; cursor:pointer;" data-action="exportSchemaJson()">导出 JSON</button>
      <button type="button" style="padding:0.35rem 0.75rem; font-size:0.75rem; font-weight:600; background:#16a34a; border:1px solid #15803d; color:#ffffff; border-radius:6px; cursor:pointer;" data-action="saveSchemaConfig()">保存表单配置并跨网同步</button>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:0.4rem;">
    <div class="table-container">
      <table class="compact-table" style="width:100%;">
        <thead>
          <tr>
            <th class="col-idx" style="width:50px;">序号</th>
            <th style="width:160px;">键名 (Key)</th>
            <th style="width:160px;">中文标签</th>
            <th style="width:120px;">控件类型</th>
            <th>候选项列表</th>
            <th style="width:180px; text-align:center;">操作</th>
          </tr>
        </thead>
        <tbody id="schemaFieldsBody">
          <tr><td colspan="6" style="text-align:center; color:var(--text-muted);">加载中...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination-bar" id="schemaPagination">
      <div class="pagination-info">
        <span>共 <strong id="schemaTotalCount">0</strong> 个字段</span>
        <span>第 <strong id="schemaCurrentPageText">1</strong> / <strong id="schemaTotalPagesText">1</strong> 页</span>
      </div>
      <div class="pagination-controls">
        <select id="schemaPageSizeSelect" data-action-change="changeSchemaPageSize(this.value)">
          <option value="10">10 条/页</option>
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
        </select>
        <button class="btn-page" id="schemaPrevBtn" data-action="prevSchemaPage()">上一页</button>
        <button class="btn-page" id="schemaNextBtn" data-action="nextSchemaPage()">下一页</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal 1: + 新增动态表单字段 弹窗 -->
<div id="addFieldModal" class="modal-overlay" style="display:none;">
  <div class="card modal-dialog" style="width:460px; max-width:90vw; flex:none; margin:auto; background:#fff; border-radius:10px; padding:1.2rem; box-shadow:0 12px 30px rgba(0,0,0,0.2);">
    <div style="font-size:0.9rem; font-weight:700; color:var(--primary); margin-bottom:0.75rem; border-bottom:1px solid var(--border-color); padding-bottom:0.45rem; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:0.4rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:16px; height:16px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        新增动态表单字段
      </div>
      <button type="button" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);" data-action="closeAddFieldModal()">&times;</button>
    </div>

    <form data-action-submit="handleAddFieldSubmit(event)" autocomplete="off">
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.6rem; margin-bottom:0.6rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">字段键名 (Key) <span style="color:red;">*</span></label>
          <input type="text" id="newFieldKey" placeholder="例如: location" required style="padding:0.3rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">中文显示标签 <span style="color:red;">*</span></label>
          <input type="text" id="newFieldLabel" placeholder="例如: 发生地点" required style="padding:0.3rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.6rem; margin-bottom:0.8rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">控件类型</label>
          <select id="newFieldType" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:30px;">
            <option value="text">单行文本</option>
            <option value="select">下拉单选</option>
            <option value="radio">单选框</option>
            <option value="textarea">多行文本</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">选项列表 (逗号分隔)</label>
          <input type="text" id="newFieldOptions" placeholder="例如: 选项1, 选项2" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.4rem;">
        <button type="button" class="btn btn-secondary" style="padding:0.3rem 0.75rem; font-size:0.75rem;" data-action="closeAddFieldModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.3rem 0.85rem; font-size:0.75rem;">添加到表单</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal 2: 编辑动态字段 Modal -->
<div id="editFieldModal" class="modal-overlay" style="display:none;">
  <div class="card modal-dialog" style="width:460px; max-width:90vw; flex:none; margin:auto; background:#fff; border-radius:10px; padding:1.2rem; box-shadow:0 12px 30px rgba(0,0,0,0.2);">
    <div style="font-size:0.9rem; font-weight:700; color:var(--text-main); margin-bottom:0.75rem; border-bottom:1px solid var(--border-color); padding-bottom:0.45rem; display:flex; align-items:center; justify-content:space-between;">
      <div>编辑动态字段属性</div>
      <button type="button" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);" data-action="closeEditFieldModal()">&times;</button>
    </div>

    <form data-action-submit="handleSaveField(event)" autocomplete="off">
      <input type="hidden" id="editFieldIndex">
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.6rem; margin-bottom:0.6rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">字段键名 (Key)</label>
          <input type="text" id="editFieldKey" disabled style="padding:0.3rem 0.55rem; font-size:0.775rem; height:30px; background:#f8fafc; color:#64748b; font-family:monospace;">
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">中文标签 <span style="color:red;">*</span></label>
          <input type="text" id="editFieldLabel" required style="padding:0.3rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.6rem; margin-bottom:0.8rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">控件类型</label>
          <select id="editFieldType" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:30px;">
            <option value="text">单行文本</option>
            <option value="select">下拉单选</option>
            <option value="radio">单选框</option>
            <option value="textarea">多行文本</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">选项列表 (逗号分隔)</label>
          <input type="text" id="editFieldOptions" placeholder="例如 选项1, 选项2" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.4rem;">
        <button type="button" class="btn btn-secondary" style="padding:0.3rem 0.75rem; font-size:0.75rem;" data-action="closeEditFieldModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.3rem 0.85rem; font-size:0.75rem;">保存字段修改</button>
      </div>
    </form>
  </div>
</div>
