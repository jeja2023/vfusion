<div class="card" style="padding: 0.75rem 1rem; margin-bottom: 0.5rem;">
  <div class="card-header" style="margin-bottom: 0.4rem; padding-bottom: 0.35rem;">
    <div>
      <h2 style="font-size:0.9rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        第三方 FTP 服务器通道配置
      </h2>
      <p style="font-size:0.725rem; margin-top:1px;">配置数据中台自动连接第三方 FTP 服务器的 IP、端口、账号鉴权、远程目录与包前缀过滤</p>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button class="btn btn-diode" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="testCoreFtpServerConnection()">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        在线测试 FTP 连通性
      </button>
      <button class="btn btn-primary" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="saveCoreFtpChannelConfig()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存 FTP 通道配置
      </button>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:0.45rem;">
    <!-- 组一：通道开关与清理策略 -->
    <div style="background:#f8fafc; border:1px solid var(--border-color); border-radius:8px; padding:0.45rem 0.75rem;">
      <div style="font-size:0.775rem; font-weight:700; color:var(--primary); margin-bottom:0.3rem; display:flex; align-items:center; gap:0.35rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        通道控制与清理策略
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.6rem;">
        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem; font-weight:600;">FTP 远程通道状态</label>
          <div class="toggle-switch-wrapper" style="height:30px; padding:0.25rem 0.55rem;">
            <span class="toggle-switch-text" id="coreFtpEnableText" style="font-size:0.775rem;">关闭远程 FTP</span>
            <label class="toggle-switch" style="width:32px; height:16px;">
              <input type="checkbox" id="coreFtpEnableToggle" onchange="document.getElementById('coreFtpEnableText').innerText = this.checked ? '开启远程 FTP' : '关闭远程 FTP'">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem; font-weight:600;">下载后自动清理远程文件 (Auto Clean)</label>
          <div class="toggle-switch-wrapper" style="height:30px; padding:0.25rem 0.55rem;">
            <span class="toggle-switch-text" id="coreFtpDeleteText" style="font-size:0.775rem;">开启清理 (推荐)</span>
            <label class="toggle-switch" style="width:32px; height:16px;">
              <input type="checkbox" id="coreFtpDeleteToggle" onchange="document.getElementById('coreFtpDeleteText').innerText = this.checked ? '开启清理 (推荐)' : '关闭清理 (保留文件)'">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- 组二：连接凭据 -->
    <div style="background:#ffffff; border:1px solid var(--border-color); border-radius:8px; padding:0.45rem 0.75rem;">
      <div style="font-size:0.775rem; font-weight:700; color:var(--text-main); margin-bottom:0.3rem; display:flex; align-items:center; gap:0.35rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        FTP 服务器连接凭据 (Host / Account)
      </div>
      <div style="display:grid; grid-template-columns: 2fr 1fr 1.5fr 1.5fr; gap:0.5rem;">
        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">IP 地址 / 域名 (Host)</label>
          <input type="text" id="coreFtpHostInput" placeholder="例如: 192.168.1.100" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">端口号 (Port)</label>
          <input type="number" id="coreFtpPortInput" placeholder="21" value="21" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">登录用户名 (Username)</label>
          <input type="text" id="coreFtpUserInput" placeholder="例如: vfusion_user" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">登录密码 (Password)</label>
          <input type="password" id="coreFtpPasswordInput" placeholder="输入 FTP 密码" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>
      </div>
    </div>

    <!-- 组三：路径与策略 -->
    <div style="background:#ffffff; border:1px solid var(--border-color); border-radius:8px; padding:0.45rem 0.75rem;">
      <div style="font-size:0.775rem; font-weight:700; color:var(--text-main); margin-bottom:0.3rem; display:flex; align-items:center; gap:0.35rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        目录路径与网闸策略 (Path & Policy)
      </div>
      <div style="display:grid; grid-template-columns: 2fr 1.5fr 2fr; gap:0.5rem;">
        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">远程专用路径目录 (Remote Dir)</label>
          <input type="text" id="coreFtpRemoteDirInput" placeholder="例如: /vfusion_packages" value="/vfusion_packages" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">数据包匹配前缀 (Prefix)</label>
          <input type="text" id="corePkgPrefixInput" placeholder="默认: vfusion_" value="vfusion_" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">传输后缀策略 (Ext Policy)</label>
          <select id="coreFtpExtSelect" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
            <option value=".jpg">.jpg (强网闸伪装模式 - 仅放行 .jpg)</option>
            <option value=".zip">.zip (标准 Zip 压缩包模式)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="coreFtpTestStatusBox" style="margin-top:0.4rem; display:none; padding:0.45rem 0.75rem; border-radius:6px; font-size:0.775rem; font-family:monospace; line-height:1.3;"></div>
</div>

<!-- FTP 自动轮询拉取控制面板 -->
<div class="card" style="padding: 0.75rem 1rem;">
  <div class="card-header" style="margin-bottom:0.4rem; padding-bottom:0.35rem;">
    <div>
      <h2 style="font-size:0.9rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        FTP 远程自动轮询拉取
      </h2>
      <p style="font-size:0.725rem; margin-top:1px;">配置内网端定时自动从远程 FTP 服务器拉取数据包并入库处理</p>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button class="btn btn-diode" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="manualFtpPull()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        手动拉取一次
      </button>
      <button class="btn btn-primary" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="saveFtpPollInterval()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存轮询设置
      </button>
    </div>
  </div>

  <div style="background:#f8fafc; border:1px solid var(--border-color); border-radius:8px; padding:0.45rem 0.75rem;">
    <div style="display:grid; grid-template-columns: 240px 1fr; gap:0.85rem; align-items:center;">
      <div class="form-group" style="margin:0; gap:0.15rem;">
        <label style="font-size:0.75rem; font-weight:600;">自动轮询间隔 (秒)</label>
        <input type="number" id="ftpPollIntervalInput" placeholder="0 = 停止, 10 = 每10秒" value="10" min="0" max="3600" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        <small style="color:var(--text-muted); font-size:0.7rem; margin-top:1px;">0 = 停止自动轮询；建议设置 10~30 秒</small>
      </div>

      <div class="form-group" style="margin:0; gap:0.15rem;">
        <label style="font-size:0.75rem; font-weight:600;">轮询引擎实时状态</label>
        <div id="ftpPollStatusDisplay" style="padding:0.35rem 0.65rem; background:#ffffff; border:1px solid var(--border-color); border-radius:6px; font-size:0.775rem; line-height:1.4; min-height:36px; display:flex; align-items:center;">
          <span style="color:var(--text-muted);">加载中...</span>
        </div>
      </div>
    </div>
  </div>

  <div id="ftpPullResultBox" style="margin-top:0.4rem; display:none; padding:0.45rem 0.75rem; border-radius:6px; font-size:0.775rem; font-family:monospace; line-height:1.3;"></div>
</div>
