<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视汇 - 内网数据汇聚中台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages/events.css">
  <link rel="stylesheet" href="css/pages/analytics.css">
  <link rel="stylesheet" href="css/pages/builder.css">
  <link rel="stylesheet" href="css/pages/webhooks.css">
  <link rel="stylesheet" href="css/pages/audits.css">
  <link rel="stylesheet" href="css/pages/personnel.css">
  <link rel="stylesheet" href="css/pages/users.css">
  <link rel="stylesheet" href="css/pages/errors.css">
  <link rel="stylesheet" href="css/pages/system.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="brand-badge">
        <svg class="brand-logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 2.5L5 6.5V14.5C5 21.5 10 27.2 16 29.5C22 27.2 27 21.5 27 14.5V6.5L16 2.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" fill="rgba(255,255,255,0.15)"/>
          <path d="M9.5 12.5L16 19.5L22.5 12.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="11.5" r="3.2" stroke="currentColor" stroke-width="2"/>
          <circle cx="16" cy="11.5" r="1.2" fill="currentColor"/>
        </svg>
        视汇 VFusion
      </div>
      <h2 style="font-size:1.3rem; font-weight:700; color:var(--text-main);">内网数据中台登录</h2>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.35rem; margin-bottom:1.75rem;">跨隔离网数据中台安全控制台</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="builder-form" style="display:flex; flex-direction:column; background:none; border:none; padding:0; gap:1rem;">
          <div class="form-field-item" style="text-align:left;">
            <label>用户名</label>
            <input type="text" id="loginUsername" placeholder="管理员 admin / 操作员 operator / 审计员 auditor" required>
          </div>
          <div class="form-field-item" style="text-align:left;">
            <label>密码</label>
            <input type="password" id="loginPassword" placeholder="输入密码 (如 admin123 / op123 / audit123)" required>
          </div>
          <button type="submit" class="btn btn-primary" style="justify-content:center; padding:0.75rem; margin-top:0.5rem;">登录控制台</button>
        </div>
      </form>
    </div>
  </div>

  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer(event)">
    <div class="drawer-panel" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <h3 id="drawerTitle" style="font-size:1.1rem; color:var(--primary);">单据详情分析与存照</h3>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <button class="btn btn-export" style="padding:0.35rem 0.65rem;" id="drawerDownloadZipBtn">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载单据 Zip 存照
          </button>
          <button class="btn btn-diode" style="padding:0.35rem 0.65rem;" onclick="window.print()">
            <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            打印存照凭证
          </button>
          <button class="drawer-close-btn" onclick="closeDrawer()">✕</button>
        </div>
      </div>
      <div id="drawerBody"></div>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-badge">
          <svg class="brand-logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 2.5L5 6.5V14.5C5 21.5 10 27.2 16 29.5C22 27.2 27 21.5 27 14.5V6.5L16 2.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" fill="rgba(255,255,255,0.15)"/>
            <path d="M9.5 12.5L16 19.5L22.5 12.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="11.5" r="3.2" stroke="currentColor" stroke-width="2"/>
            <circle cx="16" cy="11.5" r="1.2" fill="currentColor"/>
          </svg>
          视汇
        </div>
        <div class="brand-text">
          <h1>视汇 - 内网数据汇聚中台</h1>
          <p>网闸解包校验 · 动态表单配置 · AI分析管道 · 跨网 Schema 摆渡同步</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="alert-bell-wrapper">
          <button class="btn btn-diode" style="padding:0.45rem 0.55rem;" onclick="toggleAlertDropdown()">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <span class="alert-badge" id="alertBadge" style="display:none;">0</span>
          <div class="alert-dropdown" id="alertDropdown">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; border-bottom:1px solid var(--border-color); padding-bottom:0.4rem;">
              <strong style="font-size:0.875rem;">实时告警中心</strong>
              <button class="btn btn-primary" style="padding:0.2rem 0.45rem; font-size:0.725rem;" onclick="markAlertsRead()">全部标为已读</button>
            </div>
            <div id="alertListContainer"></div>
          </div>
        </div>

        <div style="display:inline-flex; align-items:center; background:#ffffff; border:1px solid var(--border-color); border-radius:8px; padding:0.15rem 0.55rem; font-size:0.825rem; white-space:nowrap; flex-shrink:0;">
          <span class="pulse-dot disabled" id="diodePulseDot"></span>
          <select id="autoDiodeSelect" onchange="updateAutoDiodeConfig()" style="border:none; background:transparent; padding:0.3rem 0.2rem; font-weight:600; cursor:pointer; white-space:nowrap;">
            <option value="0">手动摆渡模式</option>
            <option value="3">每 3 秒自动摆渡</option>
            <option value="5">每 5 秒自动摆渡</option>
          </select>
        </div>
        <button class="btn btn-export" onclick="exportCsvReport()">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出 Excel 报表
        </button>
        <button class="btn btn-diode" onclick="triggerDiodeSimulation()">
          <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          手动单向摆渡
        </button>

        <div style="display:inline-flex; gap:0.5rem; align-items:center; margin-left:0.25rem; white-space:nowrap; flex-shrink:0;">
          <span id="userInfoTag" style="font-size:0.825rem; font-weight:600; color:var(--text-sub); white-space:nowrap; flex-shrink:0;"></span>
          <button class="btn btn-danger" style="padding:0.45rem 0.95rem; font-size:0.825rem; min-width:70px;" onclick="handleLogout()">退出</button>
        </div>
      </div>
    </header>

    <div class="tabs-nav">
      <button class="tab-btn active" id="tabBtn-events" onclick="switchTab('tab-events')">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        事件汇聚看板
      </button>
      <button class="tab-btn" id="tabBtn-analytics" onclick="switchTab('tab-analytics')">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        分析图表大屏
      </button>
      <button class="tab-btn" id="tabBtn-builder" onclick="switchTab('tab-builder')">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        表单设计器
      </button>
      <button class="tab-btn" id="tabBtn-ftp" onclick="switchTab('tab-ftp')">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        FTP 通道配置
      </button>
      <button class="tab-btn" id="tabBtn-webhooks" onclick="switchTab('tab-webhooks')">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        第三方消息分发
      </button>
      <button class="tab-btn" id="tabBtn-audits" onclick="switchTab('tab-audits')">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
        系统审计日志
      </button>
      <button class="tab-btn" id="tabBtn-personnel" onclick="switchTab('tab-personnel')">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 1 0 7.75"/></svg>
        涉事人员档案库
      </button>
      <button class="tab-btn" id="tabBtn-users" onclick="switchTab('tab-users')">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 1 0 7.75"/></svg>
        用户与权限管理
      </button>
      <button class="tab-btn" id="tabBtn-errors" onclick="switchTab('tab-errors')">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        异常单据隔离区
      </button>
      <button class="tab-btn" id="tabBtn-system" onclick="switchTab('tab-system')">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        存储与健康度
      </button>
    </div>

    <!-- 页签容器，由 pages/*.html 装载 -->
    <div id="tab-events" class="tab-content active"></div>
    <div id="tab-analytics" class="tab-content"></div>
    <div id="tab-builder" class="tab-content"></div>
    <div id="tab-ftp" class="tab-content"></div>
    <div id="tab-webhooks" class="tab-content"></div>
    <div id="tab-audits" class="tab-content"></div>
    <div id="tab-personnel" class="tab-content"></div>
    <div id="tab-users" class="tab-content"></div>
    <div id="tab-errors" class="tab-content"></div>
    <div id="tab-system" class="tab-content"></div>
  </div>

  <!-- 照片放大弹窗 Modal Lightbox -->
  <div id="imageLightboxOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.85); backdrop-filter:blur(6px); z-index:1100; align-items:center; justify-content:center;" onclick="closeImageLightbox()">
    <div style="position:relative; max-width:85vw; max-height:85vh; display:flex; flex-direction:column; align-items:center; background:#ffffff; border-radius:12px; padding:1.25rem; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);" onclick="event.stopPropagation()">
      <button onclick="closeImageLightbox()" style="position:absolute; top:-12px; right:-12px; width:32px; height:32px; border-radius:50%; background:#ef4444; color:#ffffff; border:none; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:bold; box-shadow:0 4px 6px -1px rgba(0,0,0,0.3);">✕</button>
      <img id="lightboxImg" src="" style="max-width:80vw; max-height:75vh; object-fit:contain; border-radius:8px; border:1px solid #e2e8f0; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);">
      <div id="lightboxCaption" style="margin-top:0.75rem; font-size:0.875rem; font-weight:600; color:var(--text-main);">现场照片大图凭证</div>
    </div>
  </div>

  <!-- 涉事人员详细档案弹窗 Modal -->
  <div id="personDetailModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); z-index:1150; align-items:center; justify-content:center;" onclick="closePersonDetailModal()">
    <div style="position:relative; width:420px; max-width:90vw; background:#ffffff; border-radius:12px; padding:1.5rem; box-shadow:0 20px 25px -5px rgba(0,0,0,0.3); border:1px solid #e2e8f0;" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid #e2e8f0;">
        <h3 style="font-size:1.05rem; font-weight:700; color:#1e293b; display:flex; align-items:center; gap:0.5rem;">
          <svg class="icon-svg" viewBox="0 0 24 24" style="color:#2563eb;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 1 0 7.75"/></svg>
          涉事人员详细档案
        </h3>
        <button onclick="closePersonDetailModal()" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:#64748b; font-weight:bold;">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:0.85rem; font-size:0.875rem;">
        <div style="display:flex; justify-content:space-between; background:#f8fafc; padding:0.65rem 0.85rem; border-radius:6px;">
          <span style="color:#64748b;">姓名：</span>
          <strong id="modalPersonName" style="color:#0f172a; font-size:1rem;">-</strong>
        </div>
        <div style="display:flex; justify-content:space-between; background:#f8fafc; padding:0.65rem 0.85rem; border-radius:6px;">
          <span style="color:#64748b;">身份证号码：</span>
          <code id="modalPersonIdCard" style="color:#0284c7; font-weight:600;">-</code>
        </div>
        <div style="display:flex; justify-content:space-between; background:#f8fafc; padding:0.65rem 0.85rem; border-radius:6px;">
          <span style="color:#64748b;">户籍所在地：</span>
          <span id="modalPersonDomicile" style="color:#334155; font-weight:600;">-</span>
        </div>
      </div>
      <div style="margin-top:1.25rem; text-align:right;">
        <button class="btn btn-primary" onclick="closePersonDetailModal()">关闭档案</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/pages/events.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/builder.js"></script>
  <script src="js/pages/ftp.js"></script>
  <script src="js/pages/webhooks.js"></script>
  <script src="js/pages/audits.js"></script>
  <script src="js/pages/personnel.js"></script>
  <script src="js/pages/users.js"></script>
  <script src="js/pages/errors.js"></script>
  <script src="js/pages/system.js"></script>
</body>
</html>
