<div class="card">
  <div class="card-header">
    <div>
      <h2>视频网表单设计器</h2>
      <p>独立新增或修改表单字段，提交的数据包会自动携带最新 Schema 规范。</p>
    </div>
    <div style="display:flex; gap:0.6rem;">
      <button class="btn-submit" style="width:auto; padding:0.45rem 0.85rem; font-size:0.825rem;" onclick="exportSchemaJson()">导出 JSON</button>
      <button class="btn-submit" style="width:auto; padding:0.45rem 0.85rem; font-size:0.825rem; background:var(--success);" onclick="saveSchemaConfig()">保存表单配置</button>
    </div>
  </div>

  <div class="split-layout">
    <!-- 左栏：新增字段 -->
    <div class="split-col">
      <h3 style="font-size:0.95rem; font-weight:700; color:var(--text-main);">+ 新增动态字段</h3>
      <div class="builder-form">
        <div class="form-field-item"><label>字段键名 (例如 location)</label><input type="text" id="newFieldKey" placeholder="例如 location"></div>
        <div class="form-field-item"><label>中文标签 (例如 发生地点)</label><input type="text" id="newFieldLabel" placeholder="例如 发生地点"></div>
        <div class="form-field-item">
          <label>控件类型</label>
          <select id="newFieldType">
            <option value="text">单行文本</option>
            <option value="select">下拉单选</option>
            <option value="radio">单选框</option>
            <option value="textarea">多行文本</option>
          </select>
        </div>
        <div class="form-field-item"><label>选项列表 (逗号分隔)</label><input type="text" id="newFieldOptions" placeholder="例如 选项1, 选项2"></div>
        <button class="btn-submit" style="padding:0.55rem; font-size:0.85rem;" onclick="addFieldToSchema()">+ 添加到表单字段列表</button>
      </div>
    </div>

    <!-- 右栏：字段列表表格 -->
    <div class="split-col">
      <h3 style="font-size:0.95rem; font-weight:700; color:var(--text-main);">已生效字段列表</h3>
      <div class="table-container">
        <table>
          <thead><tr><th class="col-idx">序号</th><th>键名</th><th>中文标签</th><th>类型</th><th>候选项</th><th>操作</th></tr></thead>
          <tbody id="schemaFieldsBody"></tbody>
        </table>
      </div>
      <div class="pagination-bar" id="schemaPagination">
        <div class="pagination-info">
          <span>共 <strong id="schemaTotalCount">0</strong> 个字段</span>
          <span>第 <strong id="schemaCurrentPageText">1</strong> / <strong id="schemaTotalPagesText">1</strong> 页</span>
        </div>
        <div class="pagination-controls">
          <select id="schemaPageSizeSelect" onchange="changeSchemaPageSize(this.value)">
            <option value="10">10 条/页</option>
            <option value="20">20 条/页</option>
            <option value="50">50 条/页</option>
          </select>
          <button class="btn-page" id="schemaPrevBtn" onclick="prevSchemaPage()">上一页</button>
          <button class="btn-page" id="schemaNextBtn" onclick="nextSchemaPage()">下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>
