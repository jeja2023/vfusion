<div class="card">
  <div class="card-header">
    <div>
      <h2>
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        已提交历史存照与事件单据
      </h2>
      <p>查看本终端全量已成功打包投递至网闸发送目录的历史单据、抓拍照片与录入信息</p>
    </div>
    <button class="btn btn-diode" data-action="loadPublishedHistory()">
      <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      刷新历史记录
    </button>
  </div>

  <div class="filter-bar">
    <input type="text" id="historyKeyword" placeholder="搜索事件编号/任务名称/地点/涉事人员..." data-action-input="renderPublishedHistory()" autocomplete="off">
    <select id="historyTaskFilter" data-action-change="renderPublishedHistory()">
      <option value="">所有任务名称 (全量)</option>
    </select>
  </div>

  <div class="table-container" style="margin-top:0.35rem; overflow-x:auto;">
    <table style="width:100%; border-collapse:collapse;">
      <thead>
        <tr>
          <th class="col-idx" style="width:45px; text-align:center; white-space:nowrap;">序号</th>
          <th style="width:145px; white-space:nowrap;">事件单据编号</th>
          <th style="white-space:nowrap;">所属任务名称</th>
          <th style="width:140px; white-space:nowrap;">关联任务编号</th>
          <th style="width:145px; white-space:nowrap;">提交时间</th>
          <th style="width:85px; white-space:nowrap;">录入人员</th>
          <th style="max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">发生地点</th>
          <th style="width:75px; text-align:center; white-space:nowrap;">交通方式</th>
          <th style="width:80px; white-space:nowrap;">涉事人员</th>
          <th style="width:85px; text-align:center; white-space:nowrap;">现场照片</th>
          <th style="width:115px; text-align:center; white-space:nowrap;">打包状态</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <tr><td colspan="11" style="text-align:center; padding:2.5rem; color:var(--text-muted);">暂无已提交的历史单据记录</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-bar" id="historyPagination">
    <div class="pagination-info">
      <span>共 <strong id="historyTotalCount">0</strong> 条历史记录</span>
      <span>第 <strong id="historyCurrentPageText">1</strong> / <strong id="historyTotalPagesText">1</strong> 页</span>
    </div>
    <div class="pagination-controls">
      <select id="historyPageSizeSelect" data-action-change="changeHistoryPageSize(this.value)">
        <option value="10">10 条/页</option>
        <option value="20">20 条/页</option>
        <option value="50">50 条/页</option>
      </select>
      <button class="btn-page" id="historyPrevBtn" data-action="prevHistoryPage()">上一页</button>
      <button class="btn-page" id="historyNextBtn" data-action="nextHistoryPage()">下一页</button>
    </div>
  </div>
</div>
