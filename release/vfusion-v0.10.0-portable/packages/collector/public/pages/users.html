<div class="card">
  <div class="card-header"><h2>视频网用户与 RBAC 权限管理</h2></div>

  <div class="split-layout">
    <!-- 左栏：新增用户 -->
    <div class="split-col">
      <h3 style="font-size:0.95rem; font-weight:700; color:var(--text-main);">+ 新增视频网账号</h3>
      <div class="builder-form">
        <div class="form-field-item"><label>用户名 (例如 zhangsan)</label><input type="text" id="newUsername" placeholder="用户名"></div>
        <div class="form-field-item"><label>姓名 (例如 张三)</label><input type="text" id="newFullname" placeholder="真实姓名"></div>
        <div class="form-field-item"><label>登录密码</label><input type="password" id="newUserPwd" placeholder="设置初始密码"></div>
        <div class="form-field-item">
          <label>指派角色</label>
          <select id="newUserRole">
            <option value="operator">业务操作员 (operator)</option>
            <option value="auditor">安全审计员 (auditor)</option>
            <option value="admin">系统超级管理员 (admin)</option>
          </select>
        </div>
        <button class="btn-submit" style="padding:0.55rem; font-size:0.85rem;" onclick="createNewUser()">+ 创建用户账号</button>
      </div>
    </div>

    <!-- 右栏：用户账号列表 -->
    <div class="split-col">
      <h3 style="font-size:0.95rem; font-weight:700; color:var(--text-main);">视频网账号列表</h3>
      <div class="table-container">
        <table>
          <thead><tr><th class="col-idx">序号</th><th>用户名</th><th>真实姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
      <div class="pagination-bar" id="usersPagination">
        <div class="pagination-info">
          <span>共 <strong id="usersTotalCount">0</strong> 个账号</span>
          <span>第 <strong id="usersCurrentPageText">1</strong> / <strong id="usersTotalPagesText">1</strong> 页</span>
        </div>
        <div class="pagination-controls">
          <select id="usersPageSizeSelect" onchange="changeUsersPageSize(this.value)">
            <option value="10">10 条/页</option>
            <option value="20">20 条/页</option>
            <option value="50">50 条/页</option>
          </select>
          <button class="btn-page" id="usersPrevBtn" onclick="prevUsersPage()">上一页</button>
          <button class="btn-page" id="usersNextBtn" onclick="nextUsersPage()">下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>
