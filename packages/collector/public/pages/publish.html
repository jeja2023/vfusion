<div class="card">
  <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; padding-bottom:0.75rem;">
    <div>
      <h2>
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        上传图片
      </h2>
      <p style="font-size:0.8rem; color:var(--text-muted); margin-top:0.15rem;">向指定任务提交现场抓拍照片，系统将自动打包生成防篡改标准单据存照投递至隔离网闸发送目录</p>
    </div>
    <button type="button" class="btn" style="background:#eff6ff; border:1px solid #bfdbfe; color:#1d4ed8; font-size:0.825rem; font-weight:700; padding:0.45rem 0.9rem; cursor:pointer; display:inline-flex; align-items:center; gap:0.35rem;" data-action="switchTab('tab-tasks')">
      <svg class="icon-svg" viewBox="0 0 24 24" style="width:15px; height:15px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回任务列表
    </button>
  </div>

  <form id="publishForm" data-action-submit="event.preventDefault(); handlePublishSubmit(event);" style="display:flex; flex-direction:column; flex:1;" autocomplete="off">
    <div class="split-layout" style="grid-template-columns: 0.85fr 1.15fr;">
      <!-- 左栏：现场抓拍照片上传与大图预览 -->
      <div class="split-col">
        <div class="form-group" style="flex:1; display:flex; flex-direction:column;">
          <label style="margin-bottom:0.45rem; display:block;">上传图片 <span class="req">*</span></label>
          <div class="upload-zone" id="uploadZone" data-action="document.getElementById('photoInput').click()">
            <div class="upload-zone-prompt" id="uploadPrompt">
              <svg class="upload-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <p style="font-size:0.925rem; font-weight:600; color:var(--text-main);">点击或拖拽上传图片</p>
              <p style="font-size:0.775rem; color:var(--text-muted); margin-top:4px;">支持 JPG / PNG，自动计算 SHA-256 摘要并生成数字签名</p>
            </div>
            <div id="uploadPreviewContent" style="display:none; width:100%; height:100%; position:relative;"></div>
            <input type="file" id="photoInput" name="images" accept="image/*" style="display:none;" data-action-change="handleFileSelect(event)">
          </div>
        </div>
      </div>

      <!-- 右栏：表单控件信息录入 + 确认提交按钮 -->
      <div class="split-col" style="justify-content:space-between;">
        <div class="form-grid" id="dynamicFormGrid"></div>

        <button type="submit" class="btn-submit" id="btnSubmit" style="margin-top:1.25rem;">
          <svg class="icon-svg" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          确认提交并生成数据摆渡包
        </button>
      </div>
    </div>
  </form>
</div>
