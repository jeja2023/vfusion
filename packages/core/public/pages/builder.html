<div class="card">
  <div class="card-title">
    <span>表单设计器</span>
    <button class="btn btn-primary" onclick="saveSchemaConfig()">保存表单配置并跨网同步</button>
  </div>

  <div class="split-layout">
    <!-- 左栏：新增字段表单 -->
    <div class="split-col">
      <h3 style="font-size:0.925rem; font-weight:700; color:var(--text-main);">+ 新增表单字段</h3>
      <div class="builder-form">
        <div class="form-field-item"><label>字段键名 (例如 location)</label><input type="text" id="newFieldKey" placeholder="例如 location"></div>
        <div class="form-field-item"><label>中文标签 (例如 发生地点)</label><input type="text" id="newFieldLabel" placeholder="例如 发生地点"></div>
        <div class="form-field-item">
          <label>控件类型</label>
          <select id="newFieldType">
            <option value="text">单行文本</option>
            <option value="select">下拉单选</option>
            <option value="radio">单选框</option>
            <option value="textarea">多行文本</option>
          </select>
        </div>
        <div class="form-field-item"><label>选项列表 (逗号分隔)</label><input type="text" id="newFieldOptions" placeholder="例如 选项1, 选项2"></div>
        <button class="btn btn-primary" style="padding:0.5rem; justify-content:center;" onclick="addFieldToSchema()">+ 添加到表单列表</button>
      </div>
    </div>

    <!-- 右栏：字段列表表格 -->
    <div class="split-col">
      <h3 style="font-size:0.925rem; font-weight:700; color:var(--text-main);">已生效字段规范</h3>
      <div class="table-container">
        <table>
          <thead><tr><th class="col-idx">序号</th><th>键名</th><th>中文标签</th><th>类型</th><th>候选项</th><th>操作</th></tr></thead>
          <tbody id="schemaFieldsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 编辑动态字段 Modal -->
<div id="editFieldModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); z-index:1150; align-items:center; justify-content:center;" onclick="closeEditFieldModal()">
  <div style="position:relative; width:440px; max-width:92vw; background:#ffffff; border-radius:12px; padding:1.5rem; box-shadow:0 20px 25px -5px rgba(0,0,0,0.3); border:1px solid #e2e8f0;" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid #e2e8f0;">
      <h3 style="font-size:1.05rem; font-weight:700; color:#1e293b;">编辑动态字段属性</h3>
      <button onclick="closeEditFieldModal()" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:#64748b; font-weight:bold;">✕</button>
    </div>

    <form onsubmit="handleSaveField(event)">
      <input type="hidden" id="editFieldIndex">
      <div style="display:flex; flex-direction:column; gap:1rem;">
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">字段键名 (Key)</label>
          <input type="text" id="editFieldKey" disabled style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem; background:#f8fafc; color:#64748b; font-family:monospace;">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">中文标签 <span style="color:red;">*</span></label>
          <input type="text" id="editFieldLabel" required style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">控件类型</label>
          <select id="editFieldType" style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
            <option value="text">单行文本</option>
            <option value="select">下拉单选</option>
            <option value="radio">单选框</option>
            <option value="textarea">多行文本</option>
          </select>
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">选项列表 (逗号分隔)</label>
          <input type="text" id="editFieldOptions" placeholder="例如 选项1, 选项2" style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
        </div>
      </div>

      <div style="margin-top:1.5rem; text-align:right; display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn" style="background:#f1f5f9; color:#475569;" onclick="closeEditFieldModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.5rem 1.25rem;">更新字段</button>
      </div>
    </form>
  </div>
</div>
