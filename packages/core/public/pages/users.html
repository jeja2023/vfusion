<div class="card">
  <div class="card-title"><span>系统用户与 RBAC 权限管理</span></div>

  <div class="split-layout">
    <!-- 左栏：新增用户表单 -->
    <div class="split-col">
      <h3 style="font-size:0.925rem; font-weight:700; color:var(--text-main);">+ 新增用户账号</h3>
      <div class="builder-form">
        <div class="form-field-item"><label>用户名 (例如 zhangsan)</label><input type="text" id="newUsername" placeholder="用户名"></div>
        <div class="form-field-item"><label>姓名 (例如 张三)</label><input type="text" id="newFullname" placeholder="真实姓名"></div>
        <div class="form-field-item"><label>登录密码</label><input type="password" id="newUserPwd" placeholder="设置初始密码"></div>
        <div class="form-field-item">
          <label>指派角色</label>
          <select id="newUserRole">
            <option value="user">普通用户 (user)</option>
            <option value="admin">管理员 (admin)</option>
          </select>
        </div>
        <button class="btn btn-primary" style="padding:0.5rem; justify-content:center;" onclick="createNewUser()">+ 创建用户账号</button>
      </div>
    </div>

    <!-- 右栏：用户账号列表 -->
    <div class="split-col">
      <h3 style="font-size:0.925rem; font-weight:700; color:var(--text-main);">系统账号列表</h3>
      <div class="table-container">
        <table>
          <thead><tr><th class="col-idx">序号</th><th>用户名</th><th>真实姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
      <div class="pagination-bar" id="usersPagination">
        <div class="pagination-info">
          <span>共 <strong id="usersTotalCount">0</strong> 个账号</span>
          <span>第 <strong id="usersCurrentPageText">1</strong> / <strong id="usersTotalPagesText">1</strong> 页</span>
        </div>
        <div class="pagination-controls">
          <select id="usersPageSizeSelect" onchange="changeUsersPageSize(this.value)">
            <option value="10">10 条/页</option>
            <option value="20">20 条/页</option>
            <option value="50">50 条/页</option>
          </select>
          <button class="btn-page" id="usersPrevBtn" onclick="prevUsersPage()">上一页</button>
          <button class="btn-page" id="usersNextBtn" onclick="nextUsersPage()">下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 编辑用户账号 Modal -->
<div id="editUserModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); z-index:1150; align-items:center; justify-content:center;" onclick="closeEditUserModal()">
  <div style="position:relative; width:440px; max-width:92vw; background:#ffffff; border-radius:12px; padding:1.5rem; box-shadow:0 20px 25px -5px rgba(0,0,0,0.3); border:1px solid #e2e8f0;" onclick="event.stopPropagation()">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid #e2e8f0;">
      <h3 style="font-size:1.05rem; font-weight:700; color:#1e293b;">编辑用户信息</h3>
      <button onclick="closeEditUserModal()" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:#64748b; font-weight:bold;">✕</button>
    </div>

    <form onsubmit="handleSaveUser(event)">
      <input type="hidden" id="editUserId">
      <div style="display:flex; flex-direction:column; gap:1rem;">
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">用户名</label>
          <input type="text" id="editUsername" disabled style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem; background:#f8fafc; color:#64748b;">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">真实姓名 <span style="color:red;">*</span></label>
          <input type="text" id="editFullname" required style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">指派角色</label>
          <select id="editUserRole" style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
            <option value="user">普通用户 (user)</option>
            <option value="admin">管理员 (admin)</option>
          </select>
        </div>
        <div>
          <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.35rem;">账号状态</label>
          <select id="editUserStatus" style="width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:6px; font-size:0.875rem;">
            <option value="ACTIVE">启用 (ACTIVE)</option>
            <option value="INACTIVE">禁用 (INACTIVE)</option>
          </select>
        </div>
      </div>

      <div style="margin-top:1.5rem; text-align:right; display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn" style="background:#f1f5f9; color:#475569;" onclick="closeEditUserModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.5rem 1.25rem;">保存修改</button>
      </div>
    </form>
  </div>
</div>
