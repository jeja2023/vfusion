<div class="card" style="padding: 0.75rem 1rem;">
  <div class="card-header" style="margin-bottom: 0.4rem; padding-bottom: 0.35rem;">
    <div>
      <h2 style="font-size:0.9rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        第三方 FTP 服务器通道配置
      </h2>
      <p style="font-size:0.725rem; margin-top:1px;">配置视频网端自动推送 Zip 单据数据包至指定的第三方 FTP 服务器 (支持 IP、端口、账号鉴权与远程目录)</p>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button class="btn btn-diode" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="testCollectorFtpConnection()">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        在线测试 FTP 连通性
      </button>
      <button class="btn btn-primary" style="padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="saveCollectorFtpConfig()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存 FTP 通道配置
      </button>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:0.45rem;">
    <!-- 组一：通道开关 -->
    <div style="background:#f8fafc; border:1px solid var(--border-color); border-radius:8px; padding:0.45rem 0.75rem;">
      <div style="font-size:0.775rem; font-weight:700; color:var(--primary); margin-bottom:0.3rem; display:flex; align-items:center; gap:0.35rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        通道控制开关
      </div>
      <div class="form-group" style="max-width: 480px; gap:0.15rem;">
        <label style="font-size:0.75rem; font-weight:600;">FTP 自动推送功能开关</label>
        <div class="toggle-switch-wrapper" style="height:30px; padding:0.25rem 0.55rem;">
          <span class="toggle-switch-text" id="collFtpEnableText" style="font-size:0.775rem;">关闭远程 FTP</span>
          <label class="toggle-switch" style="width:32px; height:16px;">
            <input type="checkbox" id="collFtpEnableToggle" onchange="document.getElementById('collFtpEnableText').innerText = this.checked ? '开启远程 FTP' : '关闭远程 FTP'">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- 组二：连接凭据 -->
    <div style="background:#ffffff; border:1px solid var(--border-color); border-radius:8px; padding:0.45rem 0.75rem;">
      <div style="font-size:0.775rem; font-weight:700; color:var(--text-main); margin-bottom:0.3rem; display:flex; align-items:center; gap:0.35rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        FTP 服务器连接凭据 (Host / Account)
      </div>
      <div style="display:grid; grid-template-columns: 2fr 1fr 1.5fr 1.5fr; gap:0.5rem;">
        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">IP 地址 / 域名 (Host)</label>
          <input type="text" id="collFtpHostInput" placeholder="例如: 192.168.1.100" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">端口号 (Port)</label>
          <input type="number" id="collFtpPortInput" placeholder="21" value="21" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">登录用户名 (Username)</label>
          <input type="text" id="collFtpUserInput" placeholder="例如: vfusion_user" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">登录密码 (Password)</label>
          <input type="password" id="collFtpPasswordInput" placeholder="输入 FTP 密码" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>
      </div>
    </div>

    <!-- 组三：路径与策略 -->
    <div style="background:#ffffff; border:1px solid var(--border-color); border-radius:8px; padding:0.45rem 0.75rem;">
      <div style="font-size:0.775rem; font-weight:700; color:var(--text-main); margin-bottom:0.3rem; display:flex; align-items:center; gap:0.35rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        目录路径与网闸策略 (Path & Policy)
      </div>
      <div style="display:grid; grid-template-columns: 2fr 1.5fr 2fr; gap:0.5rem;">
        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">远程专用上传目录 (Remote Dir)</label>
          <input type="text" id="collFtpRemoteDirInput" placeholder="例如: /vfusion_packages" value="/vfusion_packages" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">单据包匹配前缀 (Prefix)</label>
          <input type="text" id="collPkgPrefixInput" placeholder="默认: vfusion_" value="vfusion_" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
        </div>

        <div class="form-group" style="gap:0.15rem;">
          <label style="font-size:0.75rem;">传输后缀策略 (Ext Policy)</label>
          <select id="collFtpExtSelect" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;">
            <option value=".jpg">.jpg (强网闸伪装模式 - 仅放行 .jpg)</option>
            <option value=".zip">.zip (标准 Zip 压缩包模式)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 组四：HMAC 签名秘钥配置 -->
    <div style="background:#ffffff; border:1px solid var(--border-color); border-radius:8px; padding:0.45rem 0.75rem;">
      <div style="font-size:0.775rem; font-weight:700; color:var(--text-main); margin-bottom:0.3rem; display:flex; align-items:center; gap:0.35rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px; color:var(--primary);"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        防篡改 HMAC 数字签名秘钥 (HMAC Secret)
      </div>
      <div class="form-group" style="gap:0.2rem;">
        <label style="font-size:0.75rem;">HMAC-SHA256 共享校验秘钥 <span style="font-weight:normal; color:var(--text-muted);">(必须与内网中台【存储与健康度】配置保持一致)</span></label>
        <input type="text" id="collHmacSecretInput" placeholder="请输入或粘贴与内网中台相同的 64 位 HMAC 签名秘钥" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px; font-family:monospace;">
      </div>
    </div>

    <!-- 组五：Web 控制台一键无损热升级 -->
    <div style="background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; padding:0.45rem 0.75rem;">
      <div style="font-size:0.775rem; font-weight:700; color:#0369a1; margin-bottom:0.25rem; display:flex; align-items:center; gap:0.35rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px; color:#0284c7;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Web 控制台一键无损热升级 (系统热补丁)
      </div>
      <div style="font-size:0.725rem; color:#0369a1; margin-bottom:0.4rem;">
        上传补丁包 (<code>vfusion-patch-v*.zip</code>)，系统自动备份数据库并在 3 秒内平滑重载生效，运维无需登录服务器。
      </div>
      <div style="display:flex; gap:0.4rem; align-items:center;">
        <input type="file" id="collWebUpgradeFileInput" accept=".zip" style="font-size:0.75rem; flex:1; min-width:0; background:#ffffff; padding:0.2rem 0.4rem; border:1px solid #7dd3fc; border-radius:6px;">
        <button class="btn btn-primary" style="padding:0.25rem 0.6rem; font-size:0.75rem; height:30px; white-space:nowrap;" onclick="uploadCollectorWebPatchUpgrade()">上传并无损更新</button>
      </div>
      <div id="collWebUpgradeStatusBox" style="display:none; margin-top:0.35rem; font-size:0.75rem; padding:0.45rem 0.6rem; border-radius:6px; font-family:monospace;"></div>
    </div>
  </div>

  <div id="collFtpTestStatusBox" style="margin-top:0.4rem; display:none; padding:0.45rem 0.75rem; border-radius:6px; font-size:0.775rem; font-family:monospace; line-height:1.3;"></div>
</div>
