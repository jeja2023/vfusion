<div class="card" style="padding: 0.75rem 1rem; margin-bottom: 0.5rem;">
  <div class="card-header" style="margin-bottom: 0.4rem; padding-bottom: 0.35rem; display:flex; align-items:center; justify-content:space-between;">
    <div>
      <h2 style="font-size:0.9rem; display:flex; align-items:center; gap:0.4rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        第三方系统消息分发
      </h2>
      <p style="font-size:0.725rem; margin-top:1px;">单据事件入库后将向所有【已开启】第三方系统并发推送，各节点超时与故障独立隔离</p>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button class="btn btn-primary" style="padding:0.3rem 0.65rem; font-size:0.75rem; display:flex; align-items:center; gap:0.3rem;" onclick="openAddWebhookModal()">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        + 注册第三方订阅节点
      </button>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:0.4rem;">
    <div style="font-size:0.75rem; color:#64748b; background:#f8fafc; border:1px solid #e2e8f0; padding:0.35rem 0.65rem; border-radius:6px; display:flex; align-items:center; gap:0.4rem;">
      <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px; color:var(--primary);"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      单据事件入库后将向所有【已开启】第三方系统并发推送，各节点超时与故障相互隔离。
    </div>
    <div class="table-container">
      <table class="compact-table" style="width:100%;">
        <thead>
          <tr>
            <th class="col-idx" style="width:50px;">序号</th>
            <th style="width:180px;">系统名称</th>
            <th>接口回调地址 (URL)</th>
            <th style="width:110px;">分发开关</th>
            <th style="width:150px;">最近状态</th>
            <th style="width:180px; text-align:center;">操作</th>
          </tr>
        </thead>
        <tbody id="webhookTableBody">
          <tr><td colspan="6" style="text-align:center; color:var(--text-muted);">加载中...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination-bar" id="webhookPagination">
      <div class="pagination-info">
        <span>共 <strong id="webhookTotalCount">0</strong> 个节点</span>
        <span>第 <strong id="webhookCurrentPageText">1</strong> / <strong id="webhookTotalPagesText">1</strong> 页</span>
      </div>
      <div class="pagination-controls">
        <select id="webhookPageSizeSelect" onchange="changeWebhookPageSize(this.value)">
          <option value="10">10 条/页</option>
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
        </select>
        <button class="btn-page" id="webhookPrevBtn" onclick="prevWebhookPage()">上一页</button>
        <button class="btn-page" id="webhookNextBtn" onclick="nextWebhookPage()">下一页</button>
      </div>
    </div>
    <div id="webhookTestStatusBox" style="display:none; margin-top:0.4rem; font-size:0.775rem; padding:0.45rem 0.65rem; border-radius:6px; font-family:monospace;"></div>
  </div>
</div>

<!-- Modal 1: + 注册第三方订阅节点 弹窗 -->
<div id="addWebhookModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); z-index:1150; justify-content:center; align-items:center;">
  <div class="card" style="width:480px; max-width:92vw; background:#fff; border-radius:10px; padding:1.25rem; box-shadow:0 12px 30px rgba(0,0,0,0.2);">
    <div style="font-size:0.925rem; font-weight:700; color:var(--primary); margin-bottom:0.8rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:0.4rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:16px; height:16px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        注册第三方订阅节点
      </div>
      <button type="button" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);" onclick="closeAddWebhookModal()">&times;</button>
    </div>

    <form onsubmit="handleAddWebhookSubmit(event)" autocomplete="off">
      <div class="form-group" style="margin-bottom:0.6rem;">
        <label style="font-size:0.775rem; font-weight:600;">系统名称 <span style="color:red;">*</span></label>
        <input type="text" id="hookName" placeholder="例如: 办公OA系统 / 警务中台" required style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px;">
      </div>

      <div class="form-group" style="margin-bottom:0.8rem;">
        <label style="font-size:0.775rem; font-weight:600;">接口回调地址 (URL) <span style="color:red;">*</span></label>
        <input type="text" id="hookUrl" placeholder="http://192.168.1.50/api/vfusion-callback" required style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px;">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn btn-secondary" style="padding:0.3rem 0.75rem; font-size:0.75rem;" onclick="closeAddWebhookModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.3rem 0.85rem; font-size:0.75rem;">确认注册添加</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal 2: 编辑第三方订阅节点 弹窗 -->
<div id="editWebhookModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); z-index:1150; justify-content:center; align-items:center;">
  <div class="card" style="width:480px; max-width:92vw; background:#fff; border-radius:10px; padding:1.25rem; box-shadow:0 12px 30px rgba(0,0,0,0.2);">
    <div style="font-size:0.925rem; font-weight:700; color:var(--text-main); margin-bottom:0.8rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem; display:flex; align-items:center; justify-content:space-between;">
      <div>编辑第三方订阅节点</div>
      <button type="button" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);" onclick="closeEditWebhookModal()">&times;</button>
    </div>

    <form onsubmit="handleSaveWebhook(event)" autocomplete="off">
      <input type="hidden" id="editWebhookId">
      <div class="form-group" style="margin-bottom:0.6rem;">
        <label style="font-size:0.775rem; font-weight:600;">系统名称 <span style="color:red;">*</span></label>
        <input type="text" id="editWebhookName" required style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px;">
      </div>

      <div class="form-group" style="margin-bottom:0.6rem;">
        <label style="font-size:0.775rem; font-weight:600;">接口回调地址 (URL) <span style="color:red;">*</span></label>
        <input type="text" id="editWebhookUrl" required style="padding:0.35rem 0.6rem; font-size:0.8rem; height:32px;">
      </div>

      <div style="margin-bottom:0.8rem;">
        <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.775rem; cursor:pointer; font-weight:600; color:#15803d;">
          <input type="checkbox" id="editWebhookEnabled" style="width:16px; height:16px;">
          <span>开启该第三方系统的自动消息分发</span>
        </label>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn btn-secondary" style="padding:0.3rem 0.75rem; font-size:0.75rem;" onclick="closeEditWebhookModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.3rem 0.85rem; font-size:0.75rem;">保存修改</button>
      </div>
    </form>
  </div>
</div>
