<div class="card">
  <div class="card-header">
    <div>
      <h2>
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        已提交历史存照与事件单据
      </h2>
      <p>查看本终端全量已成功打包投递至网闸发送目录的历史单据、抓拍照片与录入信息</p>
    </div>
    <button class="btn btn-diode" onclick="loadPublishedHistory()">
      <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      刷新历史记录
    </button>
  </div>

  <div class="filter-bar">
    <input type="text" id="historyKeyword" placeholder="搜索事件编号/任务名称/地点/涉事人员..." oninput="renderPublishedHistory()">
    <select id="historyTaskFilter" onchange="renderPublishedHistory()">
      <option value="">所有任务名称 (全量)</option>
    </select>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-idx">序号</th>
          <th>事件单据编号</th>
          <th>所属任务名称</th>
          <th>关联任务编号</th>
          <th>提交时间</th>
          <th>录入人员</th>
          <th style="min-width:140px;">发生地点</th>
          <th>交通方式</th>
          <th>涉事人员</th>
          <th>现场照片</th>
          <th>打包状态</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <tr><td colspan="11" style="text-align:center; padding:3rem; color:var(--text-muted);">暂无已提交的历史单据记录</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-bar" id="historyPagination">
    <div class="pagination-info">
      <span>共 <strong id="historyTotalCount">0</strong> 条历史记录</span>
      <span>第 <strong id="historyCurrentPageText">1</strong> / <strong id="historyTotalPagesText">1</strong> 页</span>
    </div>
    <div class="pagination-controls">
      <select id="historyPageSizeSelect" onchange="changeHistoryPageSize(this.value)">
        <option value="10">10 条/页</option>
        <option value="20">20 条/页</option>
        <option value="50">50 条/页</option>
      </select>
      <button class="btn-page" id="historyPrevBtn" onclick="prevHistoryPage()">上一页</button>
      <button class="btn-page" id="historyNextBtn" onclick="nextHistoryPage()">下一页</button>
    </div>
  </div>
</div>
