<!-- 第三方 FTP 服务器通道与多节点接入配置 -->
<div class="card" style="padding: 0.75rem 1rem; margin-bottom: 0.5rem;">
  <div class="card-header" style="margin-bottom: 0.4rem; padding-bottom: 0.35rem; display:flex; align-items:center; justify-content:space-between;">
    <div>
      <h2 style="font-size:0.9rem; display:flex; align-items:center; gap:0.4rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        第三方 FTP 服务器通道对接
      </h2>
      <p style="font-size:0.725rem; margin-top:1px;">注册并管理数据中台自动连接的 FTP 节点（支持同时对接多个 FTP 服务器，定时轮询拉取并隔离故障）</p>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button class="btn btn-primary" style="padding:0.3rem 0.65rem; font-size:0.75rem; display:flex; align-items:center; gap:0.3rem;" onclick="openAddFtpModal()">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        + 注册 FTP 服务器节点
      </button>
      <button class="btn btn-secondary" style="padding:0.3rem 0.65rem; font-size:0.75rem; display:flex; align-items:center; gap:0.3rem;" onclick="loadFtpServersList()">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        刷新列表
      </button>
    </div>
  </div>

  <!-- 全宽 FTP 服务器节点列表 -->
  <div style="display:flex; flex-direction:column; gap:0.4rem;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding-bottom:0.1rem;">
      <div style="font-size:0.775rem; font-weight:700; color:var(--text-main); display:flex; align-items:center; gap:0.35rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        已接入 FTP 服务器通道列表
        <span id="ftpNodeCountBadge" class="badge" style="background:var(--primary-light); color:var(--primary); font-size:0.7rem; padding:1px 8px; border-radius:10px;">0 个节点</span>
      </div>
    </div>

    <div class="table-container">
      <table class="compact-table" style="width:100%;">
        <thead>
          <tr>
            <th class="col-idx" style="width:4%;">序号</th>
            <th style="width:14%;">节点名称</th>
            <th style="width:14%;">IP 地址与端口</th>
            <th style="width:20%;">远程路径与匹配策略</th>
            <th style="width:8%;">通道开关</th>
            <th style="width:24%;">上次轮询拉取状态</th>
            <th style="width:16%; text-align:center;">操作</th>
          </tr>
        </thead>
        <tbody id="ftpServersTbody">
          <tr><td colspan="7" style="text-align:center; color:var(--text-muted);">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- FTP 自动轮询拉取控制面板 -->
<div class="card" style="padding: 0.75rem 1rem;">
  <div class="card-header" style="margin-bottom:0.4rem; padding-bottom:0.35rem;">
    <div>
      <h2 style="font-size:0.9rem; display:flex; align-items:center; gap:0.4rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--primary);"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        FTP 远程自动轮询拉取引擎
      </h2>
      <p style="font-size:0.725rem; margin-top:1px;">配置内网中台定时自动从所有已开启的 FTP 服务器通道节点抓取数据包并归集入库</p>
    </div>
    <div style="display:flex; gap:0.4rem; align-items:center;">
      <button class="btn btn-diode" style="padding:0.3rem 0.65rem; font-size:0.75rem;" onclick="manualFtpPullAll()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        手动拉取所有 FTP 节点
      </button>
      <button class="btn btn-primary" style="padding:0.3rem 0.65rem; font-size:0.75rem;" onclick="saveFtpPollInterval()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存轮询设置
      </button>
    </div>
  </div>

  <div style="background:#f8fafc; border:1px solid var(--border-color); border-radius:8px; padding:0.5rem 0.75rem;">
    <div style="display:grid; grid-template-columns: 220px 200px 1fr; gap:1rem; align-items:flex-start;">
      <div class="form-group" style="margin:0; gap:0.15rem;">
        <label style="font-size:0.75rem; font-weight:600;">自动轮询引擎开关</label>
        <div class="toggle-switch-wrapper" style="height:30px; padding:0.25rem 0.55rem; background:#ffffff; border:1px solid var(--border-color); border-radius:6px; display:flex; align-items:center; justify-content:space-between;">
          <span class="toggle-switch-text" id="ftpPollEnableText" style="font-size:0.775rem;">已停止自动轮询</span>
          <label class="toggle-switch" style="width:32px; height:16px; margin:0;">
            <input type="checkbox" id="ftpPollEnableToggle" onchange="onFtpPollToggleChange(this.checked)">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <small style="color:var(--text-muted); font-size:0.7rem; margin-top:2px;">开启后按固定周期定时抓取</small>
      </div>

      <div class="form-group" style="margin:0; gap:0.15rem;">
        <label style="font-size:0.75rem; font-weight:600;">自动轮询间隔 (秒)</label>
        <input type="number" id="ftpPollIntervalInput" placeholder="默认 10 秒" value="10" min="0" max="3600" style="padding:0.25rem 0.55rem; font-size:0.775rem; height:30px;" autocomplete="off">
        <small style="color:var(--text-muted); font-size:0.7rem; margin-top:2px;">0 或关闭开关均可停止</small>
      </div>

      <div class="form-group" style="margin:0; gap:0.15rem;">
        <label style="font-size:0.75rem; font-weight:600;">轮询引擎实时状态</label>
        <div id="ftpPollStatusDisplay" style="padding:0.4rem 0.75rem; background:#ffffff; border:1px solid var(--border-color); border-radius:6px; font-size:0.775rem; line-height:1.45; min-height:50px; display:flex; align-items:center;">
          <span style="color:var(--text-muted);">加载中...</span>
        </div>
      </div>
    </div>
  </div>

  <div id="ftpPullResultBox" style="margin-top:0.4rem; display:none; padding:0.45rem 0.75rem; border-radius:6px; font-size:0.775rem; font-family:monospace; line-height:1.3;"></div>
</div>

<!-- Modal 1: + 注册 FTP 服务器节点 弹窗 -->
<div id="addFtpServerModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); z-index:1000; justify-content:center; align-items:center;">
  <div class="card" style="width:520px; max-width:92vw; background:#fff; border-radius:10px; padding:1.25rem; box-shadow:0 12px 30px rgba(0,0,0,0.2);">
    <div style="font-size:0.925rem; font-weight:700; color:var(--primary); margin-bottom:0.8rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:0.4rem;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:16px; height:16px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        注册 FTP 服务器通道节点
      </div>
      <button type="button" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);" onclick="closeAddFtpModal()">&times;</button>
    </div>
    
    <form onsubmit="handleAddFtpServerSubmit(event)">
      <div class="form-group" style="margin-bottom:0.55rem;">
        <label style="font-size:0.75rem; font-weight:600;">服务器节点名称 <span style="color:red;">*</span></label>
        <input type="text" id="ftpNodeNameInput" placeholder="例如: 视频专网 FTP-01" required style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
      </div>

      <div style="display:grid; grid-template-columns: 2fr 1fr; gap:0.5rem; margin-bottom:0.55rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">IP / 域名 (Host) <span style="color:red;">*</span></label>
          <input type="text" id="ftpNodeHostInput" placeholder="例如: 192.168.1.100" required style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">端口号 (Port)</label>
          <input type="number" id="ftpNodePortInput" value="21" required style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; margin-bottom:0.55rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem;">登录用户名 (Username)</label>
          <input type="text" id="ftpNodeUserInput" placeholder="例如: vfusion_user" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="username">
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem;">登录密码 (Password)</label>
          <input type="password" id="ftpNodePasswordInput" placeholder="输入密码" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="new-password">
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; margin-bottom:0.55rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem;">远程专用目录 (Remote Dir)</label>
          <input type="text" id="ftpNodeRemoteDirInput" value="/vfusion_packages" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem;">文件匹配前缀 (Prefix)</label>
          <input type="text" id="ftpNodePrefixInput" value="vfusion_" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:0.55rem;">
        <label style="font-size:0.75rem;">传输后缀策略 (Ext Policy)</label>
        <select id="ftpNodeExtSelect" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;">
          <option value=".jpg">.jpg (强网闸伪装模式 - 仅放行 .jpg)</option>
          <option value=".zip">.zip (标准 Zip 压缩包模式)</option>
        </select>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; background:#f8fafc; padding:0.5rem; border-radius:6px; margin-bottom:0.8rem; border:1px solid var(--border-color);">
        <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.75rem; cursor:pointer; margin:0;">
          <input type="checkbox" id="ftpNodeDeleteToggle" checked> 下载后自动清理远程文件
        </label>
        <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.75rem; cursor:pointer; font-weight:600; color:#15803d; margin:0;">
          <input type="checkbox" id="ftpNodeEnableToggle" checked> 开启此 FTP 通道自动轮询
        </label>
      </div>

      <div id="ftpNodeFormStatus" style="display:none; margin-bottom:0.6rem; font-size:0.75rem; padding:0.4rem 0.6rem; border-radius:6px; font-family:monospace; line-height:1.3;"></div>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button type="button" class="btn btn-diode" style="padding:0.3rem 0.7rem; font-size:0.75rem;" onclick="testNewFtpNodeForm()">在线测试连通性</button>
        <div style="display:flex; gap:0.4rem;">
          <button type="button" class="btn btn-secondary" style="padding:0.3rem 0.7rem; font-size:0.75rem;" onclick="closeAddFtpModal()">取消</button>
          <button type="submit" class="btn btn-primary" style="padding:0.3rem 0.8rem; font-size:0.75rem;">确认注册并添加</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Modal 2: 编辑 FTP 节点 弹窗 -->
<div id="editFtpServerModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.45); z-index:1000; justify-content:center; align-items:center;">
  <div class="card" style="width:520px; max-width:92vw; background:#fff; border-radius:10px; padding:1.25rem; box-shadow:0 12px 30px rgba(0,0,0,0.2);">
    <div style="font-size:0.925rem; font-weight:700; color:var(--text-main); margin-bottom:0.8rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem; display:flex; align-items:center; justify-content:space-between;">
      <div>编辑 FTP 服务器通道节点</div>
      <button type="button" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);" onclick="closeEditFtpModal()">&times;</button>
    </div>

    <form onsubmit="handleSaveFtpServer(event)">
      <input type="hidden" id="editFtpId">
      <div class="form-group" style="margin-bottom:0.55rem;">
        <label style="font-size:0.75rem; font-weight:600;">节点名称 <span style="color:red;">*</span></label>
        <input type="text" id="editFtpName" required style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
      </div>

      <div style="display:grid; grid-template-columns: 2fr 1fr; gap:0.5rem; margin-bottom:0.55rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">IP / 域名 (Host) <span style="color:red;">*</span></label>
          <input type="text" id="editFtpHost" required style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem; font-weight:600;">端口号 (Port)</label>
          <input type="number" id="editFtpPort" required value="21" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; margin-bottom:0.55rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem;">登录用户名 (Username)</label>
          <input type="text" id="editFtpUser" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="username">
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem;">登录密码 (Password)</label>
          <input type="password" id="editFtpPassword" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="new-password">
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; margin-bottom:0.55rem;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem;">远程专用目录 (Remote Dir)</label>
          <input type="text" id="editFtpRemoteDir" value="/vfusion_packages" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:0.75rem;">文件匹配前缀 (Prefix)</label>
          <input type="text" id="editFtpPrefix" value="vfusion_" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;" autocomplete="off">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:0.55rem;">
        <label style="font-size:0.75rem;">传输后缀策略 (Ext Policy)</label>
        <select id="editFtpExt" style="padding:0.3rem 0.55rem; font-size:0.775rem; height:32px;">
          <option value=".jpg">.jpg (强网闸伪装模式 - 仅放行 .jpg)</option>
          <option value=".zip">.zip (标准 Zip 压缩包模式)</option>
        </select>
      </div>

      <div style="display:flex; flex-direction:column; gap:0.4rem; background:#f8fafc; padding:0.5rem; border-radius:6px; margin-bottom:0.8rem; border:1px solid var(--border-color);">
        <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.75rem; cursor:pointer; margin:0;">
          <input type="checkbox" id="editFtpDelete"> 下载后自动清理远程文件 (Auto Clean)
        </label>
        <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.75rem; cursor:pointer; font-weight:600; color:#15803d; margin:0;">
          <input type="checkbox" id="editFtpEnabled"> 开启此 FTP 服务器通道自动轮询
        </label>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn btn-secondary" style="padding:0.3rem 0.7rem; font-size:0.75rem;" onclick="closeEditFtpModal()">取消</button>
        <button type="submit" class="btn btn-primary" style="padding:0.3rem 0.8rem; font-size:0.75rem;">保存修改</button>
      </div>
    </form>
  </div>
</div>
